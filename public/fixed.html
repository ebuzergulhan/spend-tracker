<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Home Costs</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="spectrum.css"/>
</head>
<body>

<div class="sp-shell">
  <main class="sp-main">
    <div class="sp-body">

      <!-- Summary cards -->
      <div class="grid grid-cols-3 gap-4 mb-6">
        <div class="sp-kpi">
          <div class="sp-kpi-label">Monthly Total</div>
          <div class="sp-kpi-value" id="stat-monthly">—</div>
        </div>
        <div class="sp-kpi">
          <div class="sp-kpi-label">Annual Total</div>
          <div class="sp-kpi-value" id="stat-annual">—</div>
        </div>
        <div class="sp-kpi">
          <div class="sp-kpi-label">Installments Active</div>
          <div class="sp-kpi-value" id="stat-installments">—</div>
        </div>
      </div>

      <!-- Add form -->
      <div class="sp-card mb-4">
        <div class="sp-card-head">
          <div><h3 class="sp-card-title">Add Home Cost</h3></div>
        </div>
        <div class="sp-card-body">
          <form id="addForm" class="flex flex-wrap gap-3 items-end">
            <div class="flex-1 min-w-36">
              <label class="sp-field-label">Name</label>
              <input type="text" id="f-name" placeholder="e.g. Rent" required class="sp-input"/>
            </div>
            <div class="w-32">
              <label class="sp-field-label">Amount (&pound;)</label>
              <input type="number" id="f-amount" step="0.01" min="0" placeholder="0.00" required class="sp-input"/>
            </div>
            <div class="w-36">
              <label class="sp-field-label">Frequency</label>
              <select id="f-frequency" class="sp-select">
                <option value="monthly">Monthly</option>
                <option value="annual">Annual</option>
                <option value="weekly">Weekly</option>
                <option value="quarterly">Quarterly</option>
              </select>
            </div>
            <div class="w-36">
              <label class="sp-field-label">Start Date</label>
              <input type="date" id="f-start" class="sp-input"/>
            </div>
            <div class="w-32">
              <label class="sp-field-label">No. of payments</label>
              <input type="number" id="f-installments" min="1" placeholder="e.g. 5" class="sp-input"/>
              <p style="font-size:11px;color:var(--sp-ink-50);margin-top:4px;">Leave blank = ongoing</p>
            </div>
            <div class="flex-1 min-w-36">
              <label class="sp-field-label">Notes</label>
              <input type="text" id="f-notes" placeholder="Optional" class="sp-input"/>
            </div>
            <div class="flex-1 min-w-48">
              <label class="sp-field-label">Link (optional)</label>
              <input type="url" id="f-link" placeholder="https://..." class="sp-input"/>
            </div>
            <button type="submit" class="sp-btn-primary">Add</button>
          </form>
        </div>
      </div>

      <!-- Active installments -->
      <div id="installments-section" class="hidden sp-card mb-4">
        <div class="sp-card-head"><div><h3 class="sp-card-title">Installment Payments</h3></div></div>
        <div class="sp-card-body"><div id="installments-list"></div></div>
      </div>

      <!-- Ongoing list -->
      <div class="sp-card mb-6">
        <div class="sp-card-head"><div><h3 class="sp-card-title">Ongoing Home Costs</h3></div></div>
        <div class="sp-card-body"><div id="list"></div></div>
      </div>

    </div>
  </main>
</div>

<script src="shared.js"></script>
<script src="spectrum-shell.js"></script>
<script>
    initSpectrum({
      active: 'fixed',
      title: 'Home Costs',
      subtitle: 'Rent & council tax',
    });

    let items = [];
    let editingId = null;

    function cancelEdit() { editingId = null; render(); }

    async function load() {
        items = await fetch('/recurring?category=fixed').then(r => r.json());
        render();
    }

    function toMonthly(amount, freq) {
        amount = parseFloat(amount) || 0;
        if (freq === 'annual')    return amount / 12;
        if (freq === 'weekly')    return amount * 52 / 12;
        if (freq === 'quarterly') return amount / 3;
        return amount;
    }

    function freqMonths(freq) {
        if (freq === 'annual')    return 12;
        if (freq === 'quarterly') return 3;
        if (freq === 'weekly')    return 1 / 4.33;
        return 1;
    }

    function paidCount(item) {
        if (!item.start_date) return 0;
        const start = new Date(item.start_date);
        const now   = new Date();
        const monthsElapsed = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
        const paid = Math.floor(monthsElapsed / freqMonths(item.frequency)) + 1;
        return Math.max(0, Math.min(paid, item.total_installments));
    }

    function capitalise(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

    const PENCIL = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>`;
    const TRASH  = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>`;
    const LINK_ICON = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>`;

    function editFormFixed(i) {
        const inst = i.total_installments || '';
        const sd   = i.start_date ? i.start_date.split('T')[0] : '';
        return `
            <div style="padding:12px 0;border-bottom:1px solid var(--sp-ink-04);">
                <form onsubmit="saveFixed(event,${i.id})" style="background:var(--sp-panel);border-radius:12px;padding:12px;" class="space-y-2">
                    <div class="flex flex-wrap gap-2">
                        <input id="ei-name" value="${i.name}" placeholder="Name" required class="sp-input flex-1 min-w-32"/>
                        <input id="ei-amount" type="number" step="0.01" value="${i.amount}" placeholder="Amount" required class="sp-input w-28"/>
                        <select id="ei-frequency" class="sp-select w-32">
                            <option value="monthly" ${i.frequency==='monthly'?'selected':''}>Monthly</option>
                            <option value="annual" ${i.frequency==='annual'?'selected':''}>Annual</option>
                            <option value="weekly" ${i.frequency==='weekly'?'selected':''}>Weekly</option>
                            <option value="quarterly" ${i.frequency==='quarterly'?'selected':''}>Quarterly</option>
                        </select>
                        <input id="ei-start" type="date" value="${sd}" class="sp-input w-36"/>
                        <input id="ei-inst" type="number" min="1" value="${inst}" placeholder="Payments" class="sp-input w-24"/>
                        <input id="ei-notes" value="${i.notes||''}" placeholder="Notes" class="sp-input flex-1 min-w-32"/>
                        <input id="ei-link" value="${i.link||''}" placeholder="Link (optional)" class="sp-input flex-1 min-w-40"/>
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" class="sp-btn-primary" style="font-size:12px;padding:6px 16px;">Save</button>
                        <button type="button" onclick="cancelEdit()" class="sp-btn-ghost" style="font-size:12px;padding:6px 16px;">Cancel</button>
                    </div>
                </form>
            </div>`;
    }

    async function saveFixed(e, id) {
        e.preventDefault();
        const inst = document.getElementById('ei-inst').value;
        await fetch('/recurring/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: document.getElementById('ei-name').value.trim(),
                category: 'fixed',
                amount: document.getElementById('ei-amount').value,
                frequency: document.getElementById('ei-frequency').value,
                start_date: document.getElementById('ei-start').value || null,
                notes: document.getElementById('ei-notes').value.trim() || null,
                total_installments: inst ? parseInt(inst) : null,
                link: document.getElementById('ei-link').value.trim() || null
            })
        });
        editingId = null;
        load();
    }

    function itemRow(i, isInstallment) {
        if (editingId === i.id) return editFormFixed(i);
        const paid  = isInstallment ? paidCount(i) : null;
        const total = isInstallment ? parseInt(i.total_installments) : null;
        const done  = isInstallment && paid >= total;
        const remaining = isInstallment ? (total - paid) : null;
        const pct   = isInstallment ? Math.round(paid / total * 100) : null;

        const progressBar = isInstallment ? `
            <div style="margin-top:8px;">
                <div class="flex justify-between" style="font-size:12px;color:var(--sp-ink-50);margin-bottom:4px;">
                    <span>${paid} of ${total} paid${done ? ' &middot; <span style="color:var(--sp-down);font-weight:500;">Complete!</span>' : ''}</span>
                    <span>${remaining > 0 ? remaining + ' left' : ''}</span>
                </div>
                <div style="width:100%;background:var(--sp-ink-08);border-radius:999px;height:4px;">
                    <div style="height:4px;border-radius:999px;transition:width 0.7s;width:${pct}%;background:${done ? 'var(--sp-down)' : 'var(--cat-fixed-dot)'};"></div>
                </div>
            </div>
        ` : '';

        return `
            <div style="padding:12px 0;border-bottom:1px solid var(--sp-ink-04);${done ? 'opacity:0.5;' : ''}">
                <div class="flex items-center gap-4">
                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <p style="font-size:13px;font-weight:500;color:var(--sp-ink);">${i.name}</p>
                            ${done ? '<span style="font-size:11px;background:var(--sp-down-bg);color:var(--sp-down);padding:2px 8px;border-radius:999px;font-weight:500;">Finished</span>' : ''}
                            ${i.link ? `<a href="${i.link}" target="_blank" rel="noopener" title="Open link" style="color:var(--sp-ink-30);" class="hover:opacity-70 transition" onclick="event.stopPropagation()">${LINK_ICON}</a>` : ''}
                        </div>
                        <p style="font-size:12px;color:var(--sp-ink-50);margin-top:2px;">${capitalise(i.frequency)}${i.start_date ? ' &middot; from ' + formatDate(i.start_date) : ''}${i.notes ? ' &middot; ' + i.notes : ''}</p>
                        ${progressBar}
                    </div>
                    <div class="text-right" style="flex-shrink:0;">
                        <p class="sp-num" style="font-size:13px;font-weight:600;color:var(--sp-ink);">${fmt(i.amount)}</p>
                        ${i.frequency !== 'monthly' ? `<p class="sp-num" style="font-size:12px;color:var(--sp-ink-50);">${fmt(toMonthly(i.amount, i.frequency))}/mo</p>` : ''}
                    </div>
                    <button onclick="editingId=${i.id};render()" style="color:var(--sp-ink-30);margin-left:8px;flex-shrink:0;" class="hover:opacity-70 transition">${PENCIL}</button>
                    <button onclick="deleteItem(${i.id})" style="color:var(--sp-ink-30);margin-left:4px;flex-shrink:0;" class="hover:opacity-70 transition">${TRASH}</button>
                </div>
            </div>
        `;
    }

    function render() {
        const installments = items.filter(i => i.total_installments);
        const ongoing      = items.filter(i => !i.total_installments);
        const activeInstallments = installments.filter(i => paidCount(i) < parseInt(i.total_installments));

        const monthly = [
            ...ongoing.map(i => toMonthly(i.amount, i.frequency)),
            ...activeInstallments.map(i => toMonthly(i.amount, i.frequency))
        ].reduce((s, v) => s + v, 0);

        document.getElementById('stat-monthly').textContent     = fmt(monthly);
        document.getElementById('stat-annual').textContent       = fmt(monthly * 12);
        document.getElementById('stat-installments').textContent = activeInstallments.length;

        const instSec = document.getElementById('installments-section');
        const instList = document.getElementById('installments-list');
        if (installments.length) {
            instSec.classList.remove('hidden');
            instList.innerHTML = installments.map(i => itemRow(i, true)).join('');
        } else {
            instSec.classList.add('hidden');
        }

        const el = document.getElementById('list');
        if (!ongoing.length) {
            el.innerHTML = '<p style="color:var(--sp-ink-50);font-size:13px;text-align:center;padding:24px 0;">No ongoing fixed costs added yet.</p>';
        } else {
            el.innerHTML = ongoing.map(i => itemRow(i, false)).join('');
        }
    }

    document.getElementById('addForm').onsubmit = async e => {
        e.preventDefault();
        const installments = document.getElementById('f-installments').value;
        await fetch('/recurring', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: document.getElementById('f-name').value.trim(),
                category: 'fixed',
                amount: document.getElementById('f-amount').value,
                frequency: document.getElementById('f-frequency').value,
                start_date: document.getElementById('f-start').value || null,
                notes: document.getElementById('f-notes').value.trim() || null,
                total_installments: installments ? parseInt(installments) : null,
                link: document.getElementById('f-link').value.trim() || null
            })
        });
        e.target.reset();
        load();
    };

    async function deleteItem(id) {
        const ok = await showModal({ title: 'Delete', message: 'Remove this fixed cost?', type: 'confirm', confirmLabel: 'Delete', cancelLabel: 'Cancel' });
        if (!ok) return;
        await fetch('/recurring/' + id, { method: 'DELETE' });
        load();
    }

    load();
</script>
</body>
</html>
