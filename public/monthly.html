<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Reports</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="spectrum.css"/>
</head>
<body>

<div class="sp-shell">
  <main class="sp-main">
    <div class="sp-body">
      <div id="report"></div>
    </div>
  </main>
</div>

<script src="shared.js"></script>
<script src="spectrum-shell.js"></script>
<script src="report-logic.js"></script>
<script src="report-view.js"></script>
<script>
    initSpectrum({
      active: 'monthly',
      title: 'Reports',
      subtitle: 'Weekly, monthly or yearly — choose the sections to include',
    });
    ReportView.mount(document.getElementById('report'), { sectionToggles: true });
</script>
</body>
</html>
