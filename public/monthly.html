<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Report</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="spectrum.css"/>
    <style>
        .tbl th { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--sp-ink-50); padding: 0.5rem 0.75rem; text-align: right; white-space: nowrap; }
        .tbl th:first-child { text-align: left; }
        .tbl td { font-size: 0.8rem; padding: 0.6rem 0.75rem; text-align: right; white-space: nowrap; border-top: 1px solid var(--sp-ink-04); }
        .tbl td:first-child { text-align: left; font-weight: 500; color: var(--sp-ink); }
        .tbl tr:hover td { background: var(--sp-panel); }
        .tbl .total-row td { font-weight: 700; background: var(--sp-panel); border-top: 2px solid var(--sp-ink-08); color: var(--sp-ink); }
    </style>
</head>
<body>

<div class="sp-shell">
  <main class="sp-main">
    <div class="sp-body">

      <!-- Summary cards for current month -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="summaryCards"></div>

      <!-- Comparison table -->
      <div class="sp-card mb-6">
        <div class="sp-card-head">
          <div><h3 class="sp-card-title">Month-by-Month Breakdown</h3></div>
          <p style="font-size:12px;color:var(--sp-ink-50);">Most recent first</p>
        </div>
        <div class="sp-card-body overflow-x-auto">
          <div id="tableWrap"></div>
        </div>
      </div>

      <!-- Bar chart comparison -->
      <div class="sp-card mb-6">
        <div class="sp-card-head"><div><h3 class="sp-card-title">Total per Month</h3></div></div>
        <div class="sp-card-body"><div id="barChart"></div></div>
      </div>

    </div>
  </main>
</div>

<script src="shared.js"></script>
<script src="spectrum-shell.js"></script>
<script>
    initSpectrum({
      active: 'monthly',
      title: 'Monthly Report',
      subtitle: 'Compare spending month by month across all categories',
    });

    const COLS = [
        { key: 'groceries',     label: 'Groceries',     color: 'var(--cat-groceries-dot)' },
        { key: 'outabout',      label: 'Out & About',   color: 'var(--cat-outabout-dot)' },
        { key: 'shopping',      label: 'Shopping',      color: 'var(--cat-shopping-dot)' },
        { key: 'fixed',         label: 'Home Costs',    color: 'var(--cat-fixed-dot)' },
        { key: 'bills',         label: 'Bills',         color: 'var(--cat-bills-dot)' },
        { key: 'transport',     label: 'Transport',     color: 'var(--cat-transport-dot)' },
        { key: 'subscriptions', label: 'Subscriptions', color: 'var(--cat-subscriptions-dot)' },
    ];

    function rowTotal(row) {
        return COLS.reduce((s, c) => s + (parseFloat(row[c.key]) || 0), 0);
    }

    function fmtCell(v) {
        const n = parseFloat(v) || 0;
        if (n === 0) return `<span style="color:var(--sp-ink-30);">—</span>`;
        return `<span style="color:var(--sp-ink);">${fmt(n)}</span>`;
    }

    function monthLabel(m) {
        const [y, mo] = m.split('-');
        return new Date(parseInt(y), parseInt(mo) - 1).toLocaleString('en-GB', { month: 'short', year: 'numeric' });
    }

    async function load() {
        const rows = await fetch('/report/monthly').then(r => r.json());

        if (!rows.length) {
            document.getElementById('tableWrap').innerHTML = `<p style="color:var(--sp-ink-50);font-size:13px;text-align:center;padding:24px 0;">No data yet.</p>`;
            document.getElementById('barChart').innerHTML = `<p style="color:var(--sp-ink-50);font-size:13px;text-align:center;padding:24px 0;">No data yet.</p>`;
            return;
        }

        // Summary cards: most recent month
        const latest = rows[0];
        const latestTotal = rowTotal(latest);
        const cards = [
            { label: monthLabel(latest.month) + ' Total', value: latestTotal },
            ...COLS.slice(0, 3).map(c => ({ label: c.label, value: parseFloat(latest[c.key]) || 0 }))
        ];
        document.getElementById('summaryCards').innerHTML = cards.map(c => `
            <div class="sp-kpi">
                <div class="sp-kpi-label">${c.label}</div>
                <div class="sp-kpi-value">${fmt(c.value)}</div>
            </div>
        `).join('');

        // Table
        const thead = `
            <thead>
                <tr class="tbl">
                    <th class="tbl">Month</th>
                    ${COLS.map(c => `<th class="tbl" style="color:${c.color}">${c.label}</th>`).join('')}
                    <th class="tbl">Total</th>
                </tr>
            </thead>
        `;

        const tbody = rows.map(row => {
            const total = rowTotal(row);
            return `
                <tr class="tbl">
                    <td class="tbl">${monthLabel(row.month)}</td>
                    ${COLS.map(c => `<td class="tbl">${fmtCell(row[c.key])}</td>`).join('')}
                    <td class="tbl"><span style="font-weight:700;color:var(--sp-ink);">${fmt(total)}</span></td>
                </tr>
            `;
        }).join('');

        // Column totals row
        const colTotals = COLS.map(c => rows.reduce((s, r) => s + (parseFloat(r[c.key]) || 0), 0));
        const grandTotal = colTotals.reduce((a, b) => a + b, 0);
        const tfootRow = `
            <tr class="tbl total-row">
                <td class="tbl">All time</td>
                ${colTotals.map(v => `<td class="tbl">${fmt(v)}</td>`).join('')}
                <td class="tbl">${fmt(grandTotal)}</td>
            </tr>
        `;

        document.getElementById('tableWrap').innerHTML = `
            <table class="w-full tbl">
                ${thead}
                <tbody>${tbody}</tbody>
                <tfoot>${tfootRow}</tfoot>
            </table>
        `;

        // Bar chart
        const totals = rows.map(r => ({ month: r.month, total: rowTotal(r), breakdown: COLS.map(c => parseFloat(r[c.key]) || 0) }));
        const maxTotal = Math.max(...totals.map(t => t.total), 1);
        document.getElementById('barChart').innerHTML = totals.map(t => {
            const pct = (t.total / maxTotal * 100).toFixed(1);
            let offset = 0;
            const segments = COLS.map((c, i) => {
                const segPct = (t.breakdown[i] / maxTotal * 100).toFixed(1);
                const seg = `<div class="h-full absolute top-0 transition-all duration-700" style="left:${offset}%; width:${segPct}%; background:${c.color}; opacity:0.85;" title="${c.label}: ${fmt(t.breakdown[i])}"></div>`;
                offset += parseFloat(segPct);
                return seg;
            }).join('');
            return `
                <div class="flex items-center gap-3 mb-3">
                    <span style="font-size:13px;color:var(--sp-ink);width:80px;flex-shrink:0;">${monthLabel(t.month)}</span>
                    <div class="flex-1 rounded-full h-4 relative overflow-hidden" style="background:var(--sp-ink-08);">
                        ${segments}
                    </div>
                    <span class="sp-num" style="font-size:13px;font-weight:600;color:var(--sp-ink);width:80px;text-align:right;">${fmt(t.total)}</span>
                </div>
            `;
        }).join('');

        // Legend
        document.getElementById('barChart').insertAdjacentHTML('beforeend', `
            <div class="flex flex-wrap gap-3 mt-4 pt-4" style="border-top:1px solid var(--sp-ink-04);">
                ${COLS.map(c => `
                    <div class="flex items-center gap-1.5">
                        <div class="w-3 h-3 rounded-full" style="background:${c.color}"></div>
                        <span style="font-size:12px;color:var(--sp-ink-50);">${c.label}</span>
                    </div>
                `).join('')}
            </div>
        `);
    }

    load();
</script>
</body>
</html>
