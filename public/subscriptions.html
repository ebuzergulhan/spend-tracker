<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscriptions</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="spectrum.css"/>
</head>
<body>

<div class="sp-shell">
  <main class="sp-main">
    <div class="sp-body">

      <!-- Stats -->
      <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="sp-kpi">
          <div class="sp-kpi-label">Monthly Total</div>
          <div class="sp-kpi-value" id="stat-monthly">—</div>
        </div>
        <div class="sp-kpi">
          <div class="sp-kpi-label">Annual Total</div>
          <div class="sp-kpi-value" id="stat-annual">—</div>
        </div>
      </div>

      <!-- Add form -->
      <div class="sp-card mb-4">
        <div class="sp-card-head">
          <div><h3 class="sp-card-title">Add Subscription</h3></div>
        </div>
        <div class="sp-card-body">
          <form id="addForm" class="flex flex-wrap gap-3 items-end">
            <div class="flex-1 min-w-36">
              <label class="sp-field-label">Name</label>
              <input type="text" id="f-name" placeholder="e.g. Netflix" required class="sp-input"/>
            </div>
            <div class="w-32">
              <label class="sp-field-label">Amount (&pound;)</label>
              <input type="number" id="f-amount" step="0.01" min="0" placeholder="0.00" required class="sp-input"/>
            </div>
            <div class="w-36">
              <label class="sp-field-label">Frequency</label>
              <select id="f-frequency" class="sp-select">
                <option value="monthly">Monthly</option>
                <option value="annual">Annual</option>
                <option value="weekly">Weekly</option>
                <option value="quarterly">Quarterly</option>
              </select>
            </div>
            <div class="w-36">
              <label class="sp-field-label">Start Date</label>
              <input type="date" id="f-start" class="sp-input"/>
            </div>
            <div class="flex-1 min-w-36">
              <label class="sp-field-label">Notes</label>
              <input type="text" id="f-notes" placeholder="Optional" class="sp-input"/>
            </div>
            <button type="submit" class="sp-btn-primary">Add</button>
          </form>
        </div>
      </div>

      <!-- List -->
      <div class="sp-card mb-6">
        <div class="sp-card-head">
          <div><h3 class="sp-card-title">Active Subscriptions</h3></div>
        </div>
        <div class="sp-card-body">
          <div id="list"></div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="shared.js"></script>
<script src="spectrum-shell.js"></script>
<script>
    initSpectrum({
      active: 'subscriptions',
      title: 'Subscriptions',
      subtitle: 'Netflix, Spotify, gym & all recurring subscriptions',
    });

    let items = [];
    let editingId = null;
    const PENCIL = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>`;
    const TRASH  = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>`;

    function cancelEdit() { editingId = null; render(); }

    async function load() {
        items = await fetch('/recurring?category=subscription').then(r => r.json());
        render();
    }

    function toMonthly(amount, freq) {
        amount = parseFloat(amount) || 0;
        if (freq === 'annual')    return amount / 12;
        if (freq === 'weekly')    return amount * 52 / 12;
        if (freq === 'quarterly') return amount / 3;
        return amount;
    }

    function capitalise(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

    function editForm(i) {
        const sd = i.start_date ? i.start_date.split('T')[0] : '';
        return `
            <div style="padding:12px 0;border-bottom:1px solid var(--sp-ink-04);">
                <form onsubmit="saveItem(event,${i.id})" style="background:var(--sp-panel);border-radius:12px;padding:12px;" class="space-y-2">
                    <div class="flex flex-wrap gap-2">
                        <input id="ei-name" value="${i.name}" placeholder="Name" required class="sp-input flex-1 min-w-32"/>
                        <input id="ei-amount" type="number" step="0.01" value="${i.amount}" required class="sp-input w-28"/>
                        <select id="ei-frequency" class="sp-select w-32">
                            <option value="monthly" ${i.frequency==='monthly'?'selected':''}>Monthly</option>
                            <option value="annual" ${i.frequency==='annual'?'selected':''}>Annual</option>
                            <option value="weekly" ${i.frequency==='weekly'?'selected':''}>Weekly</option>
                            <option value="quarterly" ${i.frequency==='quarterly'?'selected':''}>Quarterly</option>
                        </select>
                        <input id="ei-start" type="date" value="${sd}" class="sp-input w-36"/>
                        <input id="ei-notes" value="${i.notes||''}" placeholder="Notes" class="sp-input flex-1 min-w-32"/>
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" class="sp-btn-primary" style="font-size:12px;padding:6px 16px;">Save</button>
                        <button type="button" onclick="cancelEdit()" class="sp-btn-ghost" style="font-size:12px;padding:6px 16px;">Cancel</button>
                    </div>
                </form>
            </div>`;
    }

    async function saveItem(e, id) {
        e.preventDefault();
        await fetch('/recurring/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: document.getElementById('ei-name').value.trim(),
                category: 'subscription',
                amount: document.getElementById('ei-amount').value,
                frequency: document.getElementById('ei-frequency').value,
                start_date: document.getElementById('ei-start').value || null,
                notes: document.getElementById('ei-notes').value.trim() || null
            })
        });
        editingId = null;
        load();
    }

    function render() {
        const monthly = items.reduce((s, i) => s + toMonthly(i.amount, i.frequency), 0);
        document.getElementById('stat-monthly').textContent = fmt(monthly);
        document.getElementById('stat-annual').textContent  = fmt(monthly * 12);

        const el = document.getElementById('list');
        if (!items.length) { el.innerHTML = '<p style="color:var(--sp-ink-50);font-size:13px;text-align:center;padding:24px 0;">No subscriptions added yet.</p>'; return; }

        el.innerHTML = items.map(i => {
            if (editingId === i.id) return editForm(i);
            return `
            <div class="flex items-center gap-4" style="padding:12px 0;border-bottom:1px solid var(--sp-ink-04);">
                <div style="width:36px;height:36px;border-radius:50%;background:var(--cat-subscriptions-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <span style="color:var(--cat-subscriptions-fg);font-weight:700;font-size:13px;">${i.name.charAt(0).toUpperCase()}</span>
                </div>
                <div class="flex-1">
                    <p style="font-size:13px;font-weight:500;color:var(--sp-ink);">${i.name}</p>
                    <p style="font-size:12px;color:var(--sp-ink-50);margin-top:2px;">${capitalise(i.frequency)}${i.start_date ? ' &middot; since ' + formatDate(i.start_date) : ''}${i.notes ? ' &middot; ' + i.notes : ''}</p>
                </div>
                <div class="text-right">
                    <p class="sp-num" style="font-size:13px;font-weight:600;color:var(--sp-ink);">${fmt(i.amount)}</p>
                    ${i.frequency !== 'monthly' ? `<p class="sp-num" style="font-size:12px;color:var(--sp-ink-50);">${fmt(toMonthly(i.amount, i.frequency))}/mo</p>` : ''}
                </div>
                <button onclick="editingId=${i.id};render()" style="color:var(--sp-ink-30);margin-left:8px;" class="hover:opacity-70 transition">${PENCIL}</button>
                <button onclick="deleteItem(${i.id})" style="color:var(--sp-ink-30);margin-left:4px;" class="hover:opacity-70 transition">${TRASH}</button>
            </div>`;
        }).join('');
    }

    document.getElementById('addForm').onsubmit = async e => {
        e.preventDefault();
        await fetch('/recurring', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: document.getElementById('f-name').value.trim(),
                category: 'subscription',
                amount: document.getElementById('f-amount').value,
                frequency: document.getElementById('f-frequency').value,
                start_date: document.getElementById('f-start').value || null,
                notes: document.getElementById('f-notes').value.trim() || null
            })
        });
        e.target.reset();
        load();
    };

    async function deleteItem(id) {
        const ok = await showModal({ title: 'Delete', message: 'Remove this subscription?', type: 'confirm', confirmLabel: 'Delete', cancelLabel: 'Cancel' });
        if (!ok) return;
        await fetch('/recurring/' + id, { method: 'DELETE' });
        load();
    }

    load();
</script>
</body>
</html>
