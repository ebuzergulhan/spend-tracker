<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Home</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="spectrum.css"/>
</head>
<body>

<div class="sp-shell">
  <main class="sp-main">
    <div class="sp-body">

      <!-- Hero: total + Coming up -->
      <div class="grid gap-4 mb-4" style="grid-template-columns: 1.05fr 1.4fr;">

        <!-- Total this month -->
        <div class="sp-card">
          <div class="sp-card-body">
            <div class="sp-kpi-label">Total spent this month</div>
            <div class="flex items-baseline gap-3 mt-2">
              <span class="sp-num" id="sum-total" style="font-size: 44px; font-weight: 700; letter-spacing: -1.5px;">—</span>
            </div>
            <div class="sp-kpi-sub mt-1.5" id="month-label">&nbsp;</div>
          </div>
        </div>

        <!-- Coming up -->
        <div class="sp-card">
          <div class="sp-card-head">
            <div>
              <h3 class="sp-card-title">Coming up</h3>
              <div class="sp-card-sub">Next recurring payments due</div>
            </div>
            <a href="upcoming.html" style="font-size:12px;color:var(--sp-ink-70);font-weight:500;text-decoration:none">See all →</a>
          </div>
          <div id="upcoming-list" style="padding: 4px 10px;">
            <p class="sp-kpi-sub" style="text-align:center;padding:16px">Loading...</p>
          </div>
        </div>
      </div>

      <!-- Category breakdown -->
      <div class="sp-card">
        <div class="sp-card-head">
          <div>
            <h3 class="sp-card-title">Spending by category</h3>
            <div class="sp-card-sub" id="breakdown-month">This month</div>
          </div>
          <a href="monthly.html" style="font-size:12px;color:var(--sp-ink-70);font-weight:500;text-decoration:none">Compare months →</a>
        </div>
        <div class="sp-card-body">
          <!-- Stacked bar -->
          <div id="stacked-bar" class="flex mb-5" style="height: 14px; border-radius: 6px; overflow: hidden; background: var(--sp-ink-04);"></div>
          <!-- Category list -->
          <div id="breakdown-list" class="grid gap-y-2.5" style="grid-template-columns: 1fr 1fr; column-gap: 32px;"></div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="shared.js"></script>
<script src="spectrum-shell.js"></script>
<script>
  initSpectrum({
    active: 'home',
    title: 'Finance Home',
    subtitle: 'Your finances at a glance',
    actions: `<a href="upcoming.html" class="sp-btn-ghost" style="text-decoration:none">Upcoming</a>
              <a href="index.html"    class="sp-btn-primary" style="text-decoration:none">+ Log expense</a>`,
  });

  const SECTIONS = [
    { key: 'groceries',     label: 'Groceries',     catKey: 'groceries',     href: 'index.html' },
    { key: 'outabout',      label: 'Out & About',   catKey: 'outabout',      href: 'outabout.html' },
    { key: 'fixed',         label: 'Home Costs',    catKey: 'fixed',         href: 'fixed.html' },
    { key: 'bills',         label: 'Bills',         catKey: 'bills',         href: 'bills.html' },
    { key: 'transport',     label: 'Transport',     catKey: 'transport',     href: 'transport.html' },
    { key: 'subscriptions', label: 'Subscriptions', catKey: 'subscriptions', href: 'subscriptions.html' },
    { key: 'shopping',      label: 'Shopping',      catKey: 'shopping',      href: 'shopping.html' },
  ];

  async function load() {
    const data = await fetch('/summary/home').then(r => r.json());
    document.getElementById('month-label').textContent = data.month || 'This month';
    document.getElementById('breakdown-month').textContent = data.month || 'This month';

    let total = 0;
    SECTIONS.forEach(s => { total += (data[s.key] || 0); });
    document.getElementById('sum-total').textContent = fmt0(total);

    renderStackedBar(data, total);
    renderBreakdown(data, total);
    loadUpcoming();
  }

  function renderStackedBar(data, total) {
    document.getElementById('stacked-bar').innerHTML = SECTIONS.map(s => {
      const v = data[s.key] || 0;
      if (!v) return '';
      return `<div title="${s.label}: ${fmt(v)}" style="flex:${v}; background: var(--cat-${s.catKey}-dot);"></div>`;
    }).join('');
  }

  function renderBreakdown(data, total) {
    const maxVal = Math.max(...SECTIONS.map(s => data[s.key] || 0), 1);
    document.getElementById('breakdown-list').innerHTML = SECTIONS.map(s => {
      const v = data[s.key] || 0;
      const pct = total ? (v / total) * 100 : 0;
      const dPct = (v / maxVal) * 100;
      return `
        <a href="${s.href}" class="grid items-center gap-2.5 py-1.5" style="grid-template-columns: 14px 1fr 36px 88px; text-decoration:none; color:inherit;">
          <span style="width:10px;height:10px;border-radius:3px;background:var(--cat-${s.catKey}-dot);"></span>
          <div>
            <div style="font-size:13px;font-weight:500;">${s.label}</div>
            <div style="height:3px;background:var(--sp-ink-08);border-radius:2px;margin-top:4px;position:relative;overflow:hidden;">
              <div style="position:absolute;inset:0;width:${dPct}%;background:var(--cat-${s.catKey}-dot);border-radius:2px;"></div>
            </div>
          </div>
          <span class="sp-num" style="font-size:11px;color:var(--sp-ink-50);text-align:right;">${pct.toFixed(0)}%</span>
          <span class="sp-num" style="font-size:14px;font-weight:600;text-align:right;">${fmt(v)}</span>
        </a>`;
    }).join('');
  }

  async function loadUpcoming() {
    const el = document.getElementById('upcoming-list');
    try {
      const recurring = await fetch('/recurring').then(r => r.json());
      const now = new Date();
      const y = now.getFullYear(), m = now.getMonth() + 1;
      const daysInMonth = new Date(y, m, 0).getDate();
      const today = now.getDate();

      const payments = [];
      recurring.forEach(item => {
        if (!item.amount || parseFloat(item.amount) <= 0 || !item.start_date) return;
        const start = new Date(item.start_date.split('T')[0] + 'T12:00:00');
        const freq = item.frequency || 'monthly';
        const startY = start.getFullYear(), startM = start.getMonth() + 1;
        if (y < startY || (y === startY && m < startM)) return;

        let isDue = false;
        if (freq === 'monthly') isDue = true;
        else if (freq === 'quarterly') { const diff = (y - startY) * 12 + (m - startM); isDue = diff >= 0 && diff % 3 === 0; }
        else if (freq === 'annual') isDue = (startM === m);

        if (isDue) {
          const day = Math.min(start.getDate(), daysInMonth);
          if (day >= today) {
            const diff = day - today;
            payments.push({ name: item.name, category: item.category, amount: parseFloat(item.amount), day, in_days: diff });
          }
        }
      });

      payments.sort((a, b) => a.day - b.day);
      if (!payments.length) {
        el.innerHTML = '<p class="sp-kpi-sub" style="text-align:center;padding:16px">Nothing due in the next few days.</p>';
        return;
      }

      el.innerHTML = payments.slice(0, 4).map((p, i) => {
        const d = new Date(y, m - 1, p.day);
        const mon = d.toLocaleString('en-GB', { month: 'short' });
        return `
          <div class="grid items-center gap-3" style="grid-template-columns: 44px 1fr auto; padding: 10px 12px; ${i < Math.min(payments.length, 4) - 1 ? 'border-bottom: 1px solid var(--sp-ink-04);' : ''}">
            <div style="background: var(--sp-panel); border-radius: 8px; padding: 6px 0; text-align: center;">
              <div class="sp-num" style="font-size:15px;font-weight:700;line-height:1;">${p.day}</div>
              <div style="font-size:9px;color:var(--sp-ink-50);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;">${mon}</div>
            </div>
            <div style="min-width:0;">
              <div class="flex items-center gap-2">
                <span style="font-size:13px;font-weight:500;">${p.name}</span>
                ${badge(p.category)}
              </div>
              <div class="sp-kpi-sub">${p.in_days === 0 ? 'Today' : `In ${p.in_days} day${p.in_days === 1 ? '' : 's'}`}</div>
            </div>
            <div class="sp-num" style="font-size:14px;font-weight:600;">${fmt(p.amount)}</div>
          </div>`;
      }).join('');
    } catch {
      el.innerHTML = '<p class="sp-kpi-sub" style="text-align:center;padding:16px">Could not load upcoming.</p>';
    }
  }

  load();
</script>
</body>
</html>
