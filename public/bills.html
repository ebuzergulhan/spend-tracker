<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bills</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="spectrum.css"/>
</head>
<body>

<div class="sp-shell">
  <main class="sp-main">
    <div class="sp-body">

      <!-- KPI row: 4 cards -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5 sp-grid-2" id="kpi-row">
        <div class="sp-kpi">
          <div class="sp-kpi-label">This Month</div>
          <div class="sp-kpi-value sp-num" id="stat-month">—</div>
        </div>
        <div class="sp-kpi">
          <div class="sp-kpi-label">Monthly Recurring</div>
          <div class="sp-kpi-value sp-num" id="stat-recurring">—</div>
        </div>
        <div class="sp-kpi">
          <div class="sp-kpi-label">Next Due</div>
          <div class="sp-kpi-value" id="stat-next" style="font-size:18px;">—</div>
          <div class="sp-kpi-sub" id="stat-next-sub">&nbsp;</div>
        </div>
        <div class="sp-kpi">
          <div class="sp-kpi-label">Annual Total</div>
          <div class="sp-kpi-value sp-num" id="stat-annual">—</div>
          <div class="sp-kpi-sub">Projected for the year</div>
        </div>
      </div>

      <!-- Two-column: Recurring (left) + Log form (right) -->
      <div class="grid gap-4 mb-4 sp-grid-hero" style="grid-template-columns: 1.4fr 1fr;">

        <!-- Recurring Bills -->
        <div class="sp-card">
          <div class="sp-card-head">
            <div>
              <h3 class="sp-card-title">Recurring Bills</h3>
              <div class="sp-card-sub">Auto-included in Upcoming each month</div>
            </div>
            <button onclick="showAddRecurring()" id="btn-add-recurring" class="sp-btn-ghost">+ Add</button>
          </div>
          <div class="sp-card-body sp-card-body--flush">
            <div id="add-recurring-form" class="hidden" style="padding:16px 22px; background:var(--sp-panel); border-bottom:1px solid var(--sp-ink-08);">
              <div class="flex flex-wrap gap-3 items-end">
                <div class="flex-1 min-w-36">
                  <label class="sp-field-label">Bill Name</label>
                  <input type="text" id="r-name" placeholder="e.g. Electricity" class="sp-input"/>
                </div>
                <div class="w-28">
                  <label class="sp-field-label">Amount</label>
                  <input type="number" id="r-amount" step="0.01" min="0" placeholder="0.00" class="sp-input"/>
                </div>
                <div class="w-32">
                  <label class="sp-field-label">Frequency</label>
                  <select id="r-freq" class="sp-select">
                    <option value="monthly">Monthly</option>
                    <option value="quarterly">Quarterly</option>
                    <option value="annual">Annual</option>
                  </select>
                </div>
                <div class="w-36">
                  <label class="sp-field-label">Start Date</label>
                  <input type="date" id="r-start" class="sp-input"/>
                </div>
                <div class="flex gap-2">
                  <button onclick="saveNewRecurring()" class="sp-btn-primary">Save</button>
                  <button onclick="hideAddRecurring()" class="sp-btn-ghost">Cancel</button>
                </div>
              </div>
            </div>
            <div id="recurring-list" style="padding:4px 0;"></div>
          </div>
        </div>

        <!-- Log a Bill Payment -->
        <div class="sp-card" style="align-self:start;">
          <div class="sp-card-head">
            <h3 class="sp-card-title">Log a Bill Payment</h3>
          </div>
          <div class="sp-card-body">
            <form id="addForm" class="flex flex-col gap-3">
              <div>
                <label class="sp-field-label">Bill Name</label>
                <input type="text" id="f-name" placeholder="e.g. Gas" required class="sp-input"/>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="sp-field-label">Amount</label>
                  <input type="number" id="f-amount" step="0.01" min="0" placeholder="0.00" required class="sp-input"/>
                </div>
                <div>
                  <label class="sp-field-label">Date Paid</label>
                  <input type="date" id="f-date" required class="sp-input"/>
                </div>
              </div>
              <div>
                <label class="sp-field-label">Notes</label>
                <input type="text" id="f-notes" placeholder="Optional" class="sp-input"/>
              </div>
              <button type="submit" class="sp-btn-primary" style="align-self:flex-start;">+ Add Payment</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Payment History -->
      <div class="sp-card mb-6">
        <div class="sp-card-head">
          <h3 class="sp-card-title">Payment History</h3>
          <select id="yearFilter" onchange="load()" class="sp-select" style="width:auto;padding:6px 10px;">
            <option value="">All time</option>
          </select>
        </div>
        <div class="sp-card-body sp-card-body--flush" id="list"></div>
      </div>

    </div>
  </main>
</div>

<script src="shared.js"></script>
<script src="spectrum-shell.js"></script>
<script>
    initSpectrum({
        active: 'bills',
        title: 'Bills',
        subtitle: 'Gas, electricity, water & other utility bills',
        actions: `<button onclick="document.getElementById('f-name').focus()" class="sp-btn-primary">+ Log payment</button>`,
    });

    const now = new Date();
    const yearSel = document.getElementById('yearFilter');
    for (let y = now.getFullYear(); y >= now.getFullYear() - 5; y--) {
        yearSel.insertAdjacentHTML('beforeend', `<option value="${y}">${y}</option>`);
    }
    yearSel.value = String(now.getFullYear());

    let editingId = null;
    const PENCIL = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>`;
    const TRASH  = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>`;

    const COL_TMPL = '90px 1fr 1fr 100px 60px';

    let allItems = [];
    function cancelEdit() { editingId = null; renderList(); }

    function editForm(i) {
        return `
            <div style="padding:12px 22px; background:var(--sp-panel); border-bottom:1px solid var(--sp-ink-04);">
                <form onsubmit="saveItem(event,${i.id})" class="flex flex-wrap gap-2 items-end">
                    <input id="ei-name" value="${i.name}" placeholder="Name" required class="sp-input" style="flex:1;min-width:120px"/>
                    <input id="ei-amount" type="number" step="0.01" value="${i.amount}" required class="sp-input" style="width:100px"/>
                    <input id="ei-date" type="date" value="${i.date}" required class="sp-input" style="width:140px"/>
                    <input id="ei-notes" value="${i.notes||''}" placeholder="Notes" class="sp-input" style="flex:1;min-width:100px"/>
                    <button type="submit" class="sp-btn-primary">Save</button>
                    <button type="button" onclick="cancelEdit()" class="sp-btn-ghost">Cancel</button>
                </form>
            </div>`;
    }

    async function saveItem(e, id) {
        e.preventDefault();
        await fetch('/expense-log/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                category: 'bill',
                name: document.getElementById('ei-name').value.trim(),
                amount: document.getElementById('ei-amount').value,
                date: document.getElementById('ei-date').value,
                notes: document.getElementById('ei-notes').value.trim() || null
            })
        });
        editingId = null;
        load();
    }

    function renderList() {
        const el = document.getElementById('list');
        if (!allItems.length) {
            el.innerHTML = '<p style="color:var(--sp-ink-30);font-size:13px;text-align:center;padding:28px 0;">No bills logged yet.</p>';
            return;
        }

        const head = `<div class="sp-table-head" style="grid-template-columns:${COL_TMPL}">
            <span>Date</span><span>Bill</span><span>Notes</span><span style="text-align:right">Amount</span><span></span>
        </div>`;

        const rows = allItems.map(i => {
            if (editingId === i.id) return editForm(i);
            const d = i.date ? new Date(i.date.split('T')[0] + 'T12:00:00') : null;
            const dateStr = d ? d.toLocaleDateString('en-GB', { day:'2-digit', month:'short' }) : '';
            return `
            <div class="sp-table-row" style="grid-template-columns:${COL_TMPL}">
                <span class="sp-mono" style="color:var(--sp-ink-50)">${dateStr}</span>
                <span style="font-weight:500">${i.name}</span>
                <span style="color:var(--sp-ink-50)">${i.notes || ''}</span>
                <span class="sp-num" style="text-align:right;font-weight:600">${fmt(i.amount)}</span>
                <span class="flex items-center justify-end gap-1">
                    <button onclick="editingId=${i.id};renderList()" style="color:var(--sp-ink-30);cursor:pointer" onmouseover="this.style.color='var(--sp-ink)'" onmouseout="this.style.color='var(--sp-ink-30)'">${PENCIL}</button>
                    <button onclick="deleteItem(${i.id})" style="color:var(--sp-ink-30);cursor:pointer" onmouseover="this.style.color='var(--sp-up)'" onmouseout="this.style.color='var(--sp-ink-30)'">${TRASH}</button>
                </span>
            </div>`;
        }).join('');

        el.innerHTML = head + rows;
    }

    // Returns total of recurring bills that fall due in the current month
    function recurringThisMonth(bills) {
        const y = now.getFullYear(), m = now.getMonth();
        return bills.reduce((sum, b) => {
            const start = new Date(b.start_date);
            if (start > new Date(y, m + 1, 0)) return sum;
            const freq = b.frequency;
            if (freq === 'monthly') return sum + parseFloat(b.amount);
            if (freq === 'weekly')  return sum + parseFloat(b.amount) * 4;
            const monthsElapsed = (y - start.getFullYear()) * 12 + (m - start.getMonth());
            const interval = freq === 'quarterly' ? 3 : 12;
            if (monthsElapsed >= 0 && monthsElapsed % interval === 0) return sum + parseFloat(b.amount);
            return sum;
        }, 0);
    }

    // Returns monthly-equivalent total across all recurring bills
    function monthlyEquivalent(bills) {
        return bills.reduce((sum, b) => {
            const amt = parseFloat(b.amount);
            if (b.frequency === 'monthly')   return sum + amt;
            if (b.frequency === 'quarterly') return sum + amt / 3;
            if (b.frequency === 'annual')    return sum + amt / 12;
            if (b.frequency === 'weekly')    return sum + amt * 4.33;
            return sum + amt;
        }, 0);
    }

    // Returns annual-equivalent total
    function annualEquivalent(bills) {
        return bills.reduce((sum, b) => {
            const amt = parseFloat(b.amount);
            if (b.frequency === 'monthly')   return sum + amt * 12;
            if (b.frequency === 'quarterly') return sum + amt * 4;
            if (b.frequency === 'annual')    return sum + amt;
            if (b.frequency === 'weekly')    return sum + amt * 52;
            return sum + amt;
        }, 0);
    }

    function updateStats(loggedThisMonth) {
        const recurringAmt = recurringThisMonth(recurringBills);
        document.getElementById('stat-month').textContent     = fmt(loggedThisMonth + recurringAmt);
        document.getElementById('stat-recurring').textContent = fmt(monthlyEquivalent(recurringBills));
        document.getElementById('stat-annual').textContent    = fmt(annualEquivalent(recurringBills));

        // Next due
        const today = now.getDate();
        const y = now.getFullYear(), m = now.getMonth();
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        let nextDue = null;
        recurringBills.forEach(b => {
            const start = new Date(b.start_date);
            const day = Math.min(start.getDate(), daysInMonth);
            if (day >= today && !nextDue) {
                nextDue = { name: b.name, day, amount: parseFloat(b.amount) };
            }
        });
        if (nextDue) {
            document.getElementById('stat-next').textContent = nextDue.name;
            const diff = nextDue.day - today;
            document.getElementById('stat-next-sub').textContent = diff === 0 ? `${fmt(nextDue.amount)} · Today` : `${fmt(nextDue.amount)} · In ${diff} day${diff===1?'':'s'}`;
        } else {
            document.getElementById('stat-next').textContent = 'All paid';
            document.getElementById('stat-next-sub').textContent = 'Nothing more due this month';
        }
    }

    async function load() {
        const y = yearSel.value;
        const from = y ? `${y}-01-01` : '';
        const to   = y ? `${y}-12-31` : '';
        const qs   = from ? `?category=bill&from=${from}&to=${to}` : '?category=bill';
        allItems = await fetch('/expense-log' + qs).then(r => r.json());

        const monthStart = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
        const monthEnd   = new Date(now.getFullYear(), now.getMonth()+1, 0).toISOString().split('T')[0];
        const monthItems = await fetch('/expense-log?category=bill&from=' + monthStart + '&to=' + monthEnd).then(r => r.json());
        const loggedThisMonth = monthItems.reduce((s,i) => s + parseFloat(i.amount), 0);
        updateStats(loggedThisMonth);
        renderList();
    }

    document.getElementById('addForm').onsubmit = async e => {
        e.preventDefault();
        await fetch('/expense-log', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                category: 'bill',
                name: document.getElementById('f-name').value.trim(),
                amount: document.getElementById('f-amount').value,
                date: document.getElementById('f-date').value,
                notes: document.getElementById('f-notes').value.trim() || null
            })
        });
        e.target.reset();
        document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
        load();
    };

    async function deleteItem(id) {
        const ok = await showModal({ title: 'Delete', message: 'Remove this bill entry?', type: 'confirm', confirmLabel: 'Delete', cancelLabel: 'Cancel' });
        if (!ok) return;
        await fetch('/expense-log/' + id, { method: 'DELETE' });
        load();
    }

    // ── Recurring bills ──────────────────────────────────────────────────
    const FREQ_LABEL = { monthly: 'Monthly', quarterly: 'Quarterly', annual: 'Annual', weekly: 'Weekly' };
    let recurringBills = [];
    let editingRecurringId = null;

    function showAddRecurring() {
        document.getElementById('add-recurring-form').classList.remove('hidden');
        document.getElementById('btn-add-recurring').classList.add('hidden');
        document.getElementById('r-start').value = new Date().toISOString().split('T')[0];
        document.getElementById('r-name').focus();
    }
    function hideAddRecurring() {
        document.getElementById('add-recurring-form').classList.add('hidden');
        document.getElementById('btn-add-recurring').classList.remove('hidden');
        document.getElementById('r-name').value = '';
        document.getElementById('r-amount').value = '';
    }

    async function loadRecurring() {
        recurringBills = await fetch('/recurring?category=bills').then(r => r.json());
        renderRecurring();
        const monthStart = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
        const monthEnd   = new Date(now.getFullYear(), now.getMonth()+1, 0).toISOString().split('T')[0];
        const monthItems = await fetch('/expense-log?category=bill&from=' + monthStart + '&to=' + monthEnd).then(r => r.json());
        updateStats(monthItems.reduce((s,i) => s + parseFloat(i.amount), 0));
    }

    function renderRecurring() {
        const el = document.getElementById('recurring-list');
        if (!recurringBills.length) {
            el.innerHTML = '<p style="color:var(--sp-ink-30);font-size:12px;text-align:center;padding:20px 0;">No recurring bills yet. Add your first one above.</p>';
            return;
        }
        el.innerHTML = recurringBills.map(r => {
            if (editingRecurringId === r.id) return recurringEditRow(r);
            const freqLabel = FREQ_LABEL[r.frequency] || r.frequency;
            return `
            <div class="flex items-center gap-3" style="padding:10px 22px; border-bottom:1px solid var(--sp-ink-04);">
                <div style="width:7px;height:7px;border-radius:999px;background:var(--cat-bills-dot);flex-shrink:0;"></div>
                <div class="flex-1">
                    <div class="flex items-center gap-2">
                        <span style="font-size:13px;font-weight:500;">${r.name}</span>
                        <span style="font-size:10px;color:var(--sp-ink-50);background:var(--sp-ink-04);padding:2px 7px;border-radius:999px;font-weight:500;">${freqLabel}</span>
                    </div>
                    <div style="font-size:11px;color:var(--sp-ink-50);margin-top:2px;">From ${formatDate(r.start_date)}</div>
                </div>
                <span class="sp-num" style="font-size:14px;font-weight:600;">${fmt(r.amount)}</span>
                <button onclick="editingRecurringId=${r.id};renderRecurring()" style="color:var(--sp-ink-30);cursor:pointer" onmouseover="this.style.color='var(--sp-ink)'" onmouseout="this.style.color='var(--sp-ink-30)'">${PENCIL}</button>
                <button onclick="deleteRecurring(${r.id})" style="color:var(--sp-ink-30);cursor:pointer" onmouseover="this.style.color='var(--sp-up)'" onmouseout="this.style.color='var(--sp-ink-30)'">${TRASH}</button>
            </div>`;
        }).join('');
    }

    function recurringEditRow(r) {
        return `
        <div style="padding:12px 22px; background:var(--sp-panel); border-bottom:1px solid var(--sp-ink-04);">
            <div class="flex flex-wrap gap-2 items-end">
                <input id="re-name" value="${r.name}" placeholder="Name" class="sp-input" style="flex:1;min-width:120px"/>
                <input id="re-amount" type="number" step="0.01" value="${r.amount}" class="sp-input" style="width:100px"/>
                <select id="re-freq" class="sp-select" style="width:auto">
                    ${['monthly','quarterly','annual','weekly'].map(f => `<option value="${f}" ${r.frequency===f?'selected':''}>${FREQ_LABEL[f]}</option>`).join('')}
                </select>
                <input id="re-start" type="date" value="${r.start_date?.split('T')[0]||''}" class="sp-input" style="width:140px"/>
                <button onclick="saveRecurringEdit(${r.id})" class="sp-btn-primary">Save</button>
                <button onclick="editingRecurringId=null;renderRecurring()" class="sp-btn-ghost">Cancel</button>
            </div>
        </div>`;
    }

    async function saveNewRecurring() {
        const name  = document.getElementById('r-name').value.trim();
        const amount = document.getElementById('r-amount').value;
        const freq  = document.getElementById('r-freq').value;
        const start = document.getElementById('r-start').value;
        if (!name || !amount || !start) return;
        await fetch('/recurring', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, category: 'bills', amount, frequency: freq, start_date: start })
        });
        hideAddRecurring();
        loadRecurring();
    }

    async function saveRecurringEdit(id) {
        const name  = document.getElementById('re-name').value.trim();
        const amount = document.getElementById('re-amount').value;
        const freq  = document.getElementById('re-freq').value;
        const start = document.getElementById('re-start').value;
        if (!name || !amount) return;
        await fetch('/recurring/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, category: 'bills', amount, frequency: freq, start_date: start })
        });
        editingRecurringId = null;
        loadRecurring();
    }

    async function deleteRecurring(id) {
        const ok = await showModal({ title: 'Delete', message: 'Remove this recurring bill?', type: 'confirm', confirmLabel: 'Delete', cancelLabel: 'Cancel' });
        if (!ok) return;
        await fetch('/recurring/' + id, { method: 'DELETE' });
        loadRecurring();
    }

    // Set today's date as default
    document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
    loadRecurring();
    load();
</script>
</body>
</html>
