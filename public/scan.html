<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Scan receipts</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
    <link rel="stylesheet" href="spectrum.css"/>
    <style>
        .hidden, [hidden] { display:none !important; } /* other pages get .hidden from Tailwind; this page doesn't load it */
        .pick { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:22px 12px;
                border:1.5px dashed var(--sp-ink-08); border-radius:14px; cursor:pointer; text-align:center; margin-bottom:14px; }
        .pick:hover { background:var(--sp-panel); }
        .pick-title { font-weight:600; font-size:15px; color:var(--sp-ink); }
        .pick-sub { font-size:12px; color:var(--sp-ink-50); }
        .row2 { display:grid; grid-template-columns:1fr; gap:10px; }
        .hint { font-size:12px; color:var(--sp-ink-50); margin:6px 0 14px; }
        .err { color:#b3261e; font-size:13px; }
        .warn { color:#9a6a00; font-size:12px; }
        .muted { color:var(--sp-ink-50); }
        .progress { margin-top:12px; font-size:13px; color:var(--sp-ink-70, #55524d); }
        .bar { height:6px; border-radius:9999px; background:var(--sp-ink-08); overflow:hidden; margin-top:6px; }
        .bar > span { display:block; height:100%; background:var(--sp-ink); transition:width .3s; }

        .rcard { margin-bottom:12px; }
        .rhead { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
        .rshop { font-weight:650; font-size:15px; color:var(--sp-ink); word-break:break-word; }
        .rtotal { font-weight:700; font-size:17px; color:var(--sp-ink); white-space:nowrap; }
        .pill { display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:9999px; }
        .pill.ok { color:#0a7d33; background:rgba(16,160,64,.12); }
        .pill.check { color:#9a6a00; background:rgba(220,150,0,.15); }
        .pill.saved { color:#0a7d33; background:rgba(16,160,64,.12); }
        .pill.dup { color:var(--sp-ink-50); background:var(--sp-ink-08); }
        .pill.wait { color:var(--sp-ink-50); background:var(--sp-ink-08); }
        .controls { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:8px; margin:12px 0 4px; }
        .controls label { font-size:11px; font-weight:600; color:var(--sp-ink-50); display:block; margin-bottom:4px; }
        .ctl { width:100%; box-sizing:border-box; height:38px; padding:0 10px; border:1px solid var(--sp-ink-08); border-radius:10px;
               background:#fff; color:var(--sp-ink); font:inherit; font-size:14px; }
        .ctl:focus { outline:none; border-color:var(--sp-ink-30); }
        .sec-dot { width:9px; height:9px; border-radius:9999px; display:inline-block; margin-right:6px; vertical-align:middle; }
        details.items { margin-top:10px; }
        details.items summary { cursor:pointer; font-size:13px; color:var(--sp-ink-70, #55524d); }
        table.it { width:100%; border-collapse:collapse; margin-top:8px; }
        table.it td { padding:6px 4px; border-top:1px solid var(--sp-ink-04); font-size:13px; vertical-align:middle; }
        table.it td.name { word-break:break-word; }
        table.it input.price { width:72px; height:32px; padding:0 6px; border:1px solid var(--sp-ink-08); border-radius:8px; font:inherit; font-size:13px; text-align:right; }
        table.it select { height:32px; max-width:130px; border:1px solid var(--sp-ink-08); border-radius:8px; font:inherit; font-size:12px; background:#fff; }
        .neg { color:#b3261e; }
        .x { background:none; border:0; color:var(--sp-ink-30); font-size:18px; cursor:pointer; padding:0 4px; }
        .x:hover { color:#b3261e; }
        .actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
        .actions button { flex:1; min-width:120px; }
        .savebar { position:sticky; bottom:84px; z-index:5; background:var(--sp-card, #fff); border:1px solid var(--sp-ink-08);
                   border-radius:14px; padding:12px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:8px; }
        .savebar button { flex:1; min-width:200px; }
        @media (min-width:768px) { .savebar { bottom:16px; } }
        .done { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    </style>
</head>
<body>
<div class="sp-shell">
  <main class="sp-main">
    <div class="sp-body">

      <div class="sp-card" style="margin-bottom:16px;">
        <div class="sp-card-head">
          <div>
            <h3 class="sp-card-title">Add receipts</h3>
            <div class="sp-card-sub">Up to 10 photos at once. Each one is sorted into the right section for you to check.</div>
          </div>
        </div>
        <div class="sp-card-body">
          <label class="pick" for="files">
            <span class="pick-title">Choose receipt photos</span>
            <span class="pick-sub" id="picked">JPG or PNG · up to 10</span>
          </label>
          <input type="file" id="files" accept="image/*" multiple style="display:none;">

          <label class="sp-field-label" for="trip">Trip (optional)</label>
          <input id="trip" class="ctl" list="tripNames" placeholder="e.g. Oxford trip" autocomplete="off">
          <datalist id="tripNames"></datalist>
          <p class="hint">Leave it empty for everyday spending. If you fill it in, every receipt in this batch is tagged with the trip, so you can see what the trip cost.</p>

          <button id="scanBtn" class="sp-btn-primary" style="width:100%;padding:12px;">Scan receipts</button>
          <div id="progress" class="progress" hidden></div>
        </div>
      </div>

      <div id="results"></div>

      <div id="saveBar" class="savebar" hidden>
        <button id="saveAllBtn" class="sp-btn-primary" style="padding:12px;">Save all that add up</button>
        <span id="saveSummary" class="muted" style="font-size:13px;"></span>
      </div>

    </div>
  </main>
</div>

<script src="shared.js"></script>
<script src="spectrum-shell.js"></script>
<script>
    initSpectrum({ active: 'scan', title: 'Scan receipts', subtitle: 'Snap receipts in bulk — the AI files each one in the right section' });

    const MAX_FILES = 10;
    const CONCURRENCY = 2;
    const SECTION_ORDER = ['groceries', 'outabout', 'shopping', 'fuel', 'transport'];
    const SECTION_COLOR = { groceries: 'var(--cat-groceries-dot)', outabout: 'var(--cat-outabout-dot)', shopping: 'var(--cat-shopping-dot)',
                            fuel: 'var(--cat-transport-dot)', transport: 'var(--cat-transport-dot)' };
    let SECTIONS = {}, ALIASES = {};
    let chosenFiles = [];
    let cards = [];           // one per photo: { id, fileName, status, receipt, section, error, trip }
    let batchTrip = null;

    const el = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = n => '£' + (parseFloat(n) || 0).toFixed(2);
    const round2 = n => Math.round(n * 100) / 100;
    const localIsoDate = (offset = 0) => { const d = new Date(); d.setDate(d.getDate() + offset); return d.toLocaleDateString('en-CA'); };
    const perLine = section => section !== 'fuel' && section !== 'transport';

    function categoryForSection(category, section, price) {
        const s = SECTIONS[section];
        if (!s) return category;
        if (s.categories.includes(category)) return category;
        if (price < 0) return 'Discount';
        const alias = ALIASES[category];
        if (alias && s.categories.includes(alias)) return alias;
        return s.default;
    }

    // Shrink phone photos before upload (keeps them under the AI's 5 MB limit and converts iPhone HEIC to JPEG).
    function shrinkImage(file, maxDim) {
        return new Promise(resolve => {
            if (!file || !file.type.startsWith('image/')) return resolve(file);
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
                const c = document.createElement('canvas');
                c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
                c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                URL.revokeObjectURL(url);
                c.toBlob(b => resolve(b ? new File([b], 'receipt.jpg', { type: 'image/jpeg' }) : file), 'image/jpeg', 0.85);
            };
            img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
            img.src = url;
        });
    }

    // ── state helpers ─────────────────────────────────────────────────────
    const itemsSum = c => round2((c.receipt.items || []).reduce((s, it) => s + (parseFloat(it.price) || 0), 0));
    function addsUp(c) {
        if (!c.receipt) return false;
        const total = parseFloat(c.receipt.total) || 0;
        if (!(total > 0)) return false;
        if (!perLine(c.section)) return true;                    // fuel/parking are saved as one total
        return c.receipt.items.length > 0 && Math.abs(itemsSum(c) - total) < 0.02;
    }
    const pending = () => cards.filter(c => c.status === 'ready' || c.status === 'saving');

    // ── rendering ─────────────────────────────────────────────────────────
    function sectionOptions(selected) {
        return SECTION_ORDER.map(k => `<option value="${k}" ${k === selected ? 'selected' : ''}>${esc(SECTIONS[k].label)}</option>`).join('');
    }
    function categoryOptions(section, selected) {
        return SECTIONS[section].categories.map(cat => `<option ${cat === selected ? 'selected' : ''}>${esc(cat)}</option>`).join('');
    }

    function renderCard(c) {
        if (c.status === 'removed') return '';
        if (c.status === 'queued' || c.status === 'reading') {
            return `<div class="sp-card rcard"><div class="sp-card-body"><div class="done"><span class="muted">${esc(c.fileName)}</span>
                <span class="pill wait">${c.status === 'reading' ? 'Reading…' : 'Waiting…'}</span></div></div></div>`;
        }
        if (c.status === 'error') {
            return `<div class="sp-card rcard"><div class="sp-card-body"><div class="done"><span>${esc(c.fileName)}</span>
                <button class="x" data-act="remove" data-id="${c.id}" aria-label="Remove">×</button></div>
                <p class="err" style="margin:6px 0 0;">${esc(c.error)}</p></div></div>`;
        }
        const r = c.receipt;
        if (c.status === 'saved' || c.status === 'duplicate') {
            const where = SECTIONS[c.section].label;
            return `<div class="sp-card rcard"><div class="sp-card-body"><div class="done">
                <span><span class="sec-dot" style="background:${SECTION_COLOR[c.section]}"></span><strong>${esc(r.shop_name)}</strong>
                <span class="muted"> · ${money(r.total)}${c.trip ? ' · ' + esc(c.trip) : ''}</span></span>
                ${c.status === 'saved' ? `<span class="pill saved">Saved to ${esc(where)}</span>` : `<span class="pill dup">Already saved earlier</span>`}
                </div></div></div>`;
        }

        const ok = addsUp(c);
        const status = ok
            ? `<span class="pill ok">Adds up</span>`
            : `<span class="pill check">Check: items ${money(itemsSum(c))} vs total ${money(r.total)}</span>`;
        const itemRows = (r.items || []).map((it, i) => `
            <tr>
              <td class="name">${esc(it.name)}</td>
              ${perLine(c.section) ? `<td><select data-act="cat" data-id="${c.id}" data-i="${i}">${categoryOptions(c.section, it.category)}</select></td>` : '<td></td>'}
              <td style="text-align:right;"><input class="price ${it.price < 0 ? 'neg' : ''}" type="number" step="0.01" value="${(parseFloat(it.price) || 0).toFixed(2)}" data-act="price" data-id="${c.id}" data-i="${i}"></td>
              <td><button class="x" data-act="delitem" data-id="${c.id}" data-i="${i}" aria-label="Remove item">×</button></td>
            </tr>`).join('');

        return `<div class="sp-card rcard"><div class="sp-card-body">
            <div class="rhead">
              <div><div class="rshop"><span class="sec-dot" style="background:${SECTION_COLOR[c.section]}"></span>${esc(r.shop_name)}</div>
                <div style="margin-top:4px;">${status}</div></div>
              <div class="rtotal">${money(r.total)}</div>
            </div>
            <div class="controls">
              <div><label>Section${c.section === r.section ? ' (suggested)' : ''}</label>
                <select class="ctl" data-act="section" data-id="${c.id}">${sectionOptions(c.section)}</select></div>
              <div><label>Date</label>
                <input class="ctl" type="date" value="${esc(c.date)}" max="${localIsoDate(1)}" data-act="date" data-id="${c.id}"
                  style="${r.date ? '' : 'border-color:#e0a800;'}"></div>
              <div><label>Total (£)</label>
                <input class="ctl" type="number" step="0.01" value="${(parseFloat(r.total) || 0).toFixed(2)}" data-act="total" data-id="${c.id}"></div>
              ${c.section === 'fuel' ? `<div><label>Litres</label><input class="ctl" type="number" step="0.01" value="${r.litres || ''}" data-act="litres" data-id="${c.id}"></div>` : ''}
            </div>
            ${r.date ? '' : '<p class="warn" style="margin:4px 0 0;">Couldn’t read the date, so it’s set to today. Please check it.</p>'}
            ${String(r.model_used || '').includes('sonnet') ? '<p class="muted" style="font-size:12px;margin:4px 0 0;">Double-checked with a stronger model because the first read didn’t add up.</p>' : ''}
            ${!perLine(c.section) ? `<p class="muted" style="font-size:12px;margin:6px 0 0;">Saved as one ${c.section === 'fuel' ? 'fuel' : 'parking/travel'} entry of ${money(r.total)} on the Transport page.</p>` : ''}
            ${c.error ? `<p class="err" style="margin:6px 0 0;">${esc(c.error)}</p>` : ''}
            <details class="items" ${ok ? '' : 'open'}>
              <summary>${(r.items || []).length} item${(r.items || []).length === 1 ? '' : 's'}${c.trip ? ' · trip: ' + esc(c.trip) : ''}</summary>
              <table class="it"><tbody>${itemRows}</tbody></table>
            </details>
            <div class="actions">
              <button class="sp-btn-primary" data-act="save" data-id="${c.id}" ${c.status === 'saving' ? 'disabled' : ''}>${c.status === 'saving' ? 'Saving…' : 'Save'}</button>
              <button class="sp-btn-ghost" data-act="remove" data-id="${c.id}">Don’t save</button>
            </div>
        </div></div>`;
    }

    function render() {
        el('results').innerHTML = cards.map(renderCard).join('');
        const ready = cards.filter(c => c.status === 'ready');
        const matching = ready.filter(addsUp);
        const saved = cards.filter(c => c.status === 'saved').length;
        const dup = cards.filter(c => c.status === 'duplicate').length;
        const scanning = cards.some(c => c.status === 'queued' || c.status === 'reading');
        el('saveBar').hidden = scanning || (!ready.length && !saved && !dup);
        el('saveAllBtn').disabled = !matching.length;
        el('saveAllBtn').textContent = matching.length ? `Save all that add up (${matching.length})` : 'Nothing left that adds up';
        const parts = [];
        if (saved) parts.push(`${saved} saved`);
        if (dup) parts.push(`${dup} already saved before`);
        if (ready.length - matching.length) parts.push(`${ready.length - matching.length} need a look`);
        el('saveSummary').textContent = parts.join(' · ');
    }

    // ── scanning ──────────────────────────────────────────────────────────
    async function scanOne(c, file) {
        c.status = 'reading'; render();
        try {
            const fd = new FormData();
            fd.append('receiptImage', await shrinkImage(file, 2000));
            const res = await fetch('/scan', { method: 'POST', body: fd });
            const data = await res.json();
            if (!res.ok || data.error) throw new Error(data.error || 'Couldn’t read this receipt.');
            c.receipt = data;
            c.section = SECTIONS[data.section] ? data.section : 'groceries';
            c.date = data.date || localIsoDate();
            c.status = 'ready';
        } catch (e) {
            c.status = 'error';
            c.error = e.message === 'Failed to fetch' ? 'Connection problem — try this one again.' : e.message;
        }
    }

    async function startScan() {
        if (!chosenFiles.length) { el('picked').textContent = 'Choose at least one photo first'; return; }
        if (cards.some(c => c.status === 'ready')) {
            const go = await showModal({ title: 'Start a new batch?', message: 'Receipts above that aren’t saved yet will be cleared.', type: 'confirm', confirmLabel: 'Start new batch' });
            if (!go) return;
        }
        batchTrip = (el('trip').value || '').replace(/\s+/g, ' ').trim() || null;
        cards = chosenFiles.map((f, i) => ({ id: i + 1, order: i, fileName: f.name, status: 'queued', trip: batchTrip }));
        el('scanBtn').disabled = true;
        el('progress').hidden = false;
        render();

        let next = 0, done = 0;
        const updateProgress = () => {
            el('progress').innerHTML = `Reading ${Math.min(done + 1, cards.length)} of ${cards.length}… (about 10–30 seconds each, keep this page open)
                <div class="bar"><span style="width:${Math.round(done / cards.length * 100)}%"></span></div>`;
        };
        updateProgress();
        const worker = async () => {
            while (next < cards.length) {
                const i = next++;
                await scanOne(cards[i], chosenFiles[i]);
                done++; updateProgress(); render();
            }
        };
        await Promise.all(Array.from({ length: Math.min(CONCURRENCY, cards.length) }, worker));

        // Show receipts in date order (oldest first); unreadable ones last.
        cards.sort((a, b) => (a.date || '9999-12-31').localeCompare(b.date || '9999-12-31') || a.order - b.order);
        el('progress').hidden = true;
        el('scanBtn').disabled = false;
        chosenFiles = [];
        el('files').value = '';
        el('picked').textContent = 'JPG or PNG · up to 10';
        render();
    }

    // ── saving ────────────────────────────────────────────────────────────
    async function saveCard(c) {
        c.status = 'saving'; c.error = null; render();
        const r = c.receipt;
        try {
            const res = await fetch('/scan/save', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    section: c.section, shop_name: r.shop_name, date: c.date, total: r.total,
                    items: r.items, litres: r.litres, trip_name: c.trip, image_filename: r.image_filename,
                }),
            });
            const data = await res.json();
            if (!res.ok || data.error) throw new Error(data.error || 'Couldn’t save this receipt.');
            c.status = data.duplicate ? 'duplicate' : 'saved';
            if (data.shop_name) r.shop_name = data.shop_name;
        } catch (e) {
            c.status = 'ready';
            c.error = e.message === 'Failed to fetch' ? 'Connection problem — nothing was saved, try again.' : e.message;
        }
        render();
    }

    async function saveAllMatching() {
        el('saveAllBtn').disabled = true;
        for (const c of cards.filter(c => c.status === 'ready' && addsUp(c))) await saveCard(c);
        render();
    }

    // ── events ────────────────────────────────────────────────────────────
    el('files').addEventListener('change', e => {
        const files = [...e.target.files];
        if (files.length > MAX_FILES) {
            chosenFiles = [];
            e.target.value = '';
            el('picked').innerHTML = `<span class="err">You picked ${files.length} photos — please choose up to ${MAX_FILES} at a time.</span>`;
            return;
        }
        chosenFiles = files;
        el('picked').textContent = files.length ? `${files.length} photo${files.length === 1 ? '' : 's'} ready` : 'JPG or PNG · up to 10';
    });
    el('scanBtn').addEventListener('click', startScan);
    el('saveAllBtn').addEventListener('click', saveAllMatching);

    const card = id => cards.find(c => c.id === Number(id));
    el('results').addEventListener('click', e => {
        const b = e.target.closest('[data-act]');
        if (!b || b.tagName === 'SELECT' || b.tagName === 'INPUT') return;
        const c = card(b.dataset.id);
        if (!c) return;
        if (b.dataset.act === 'save') saveCard(c);
        if (b.dataset.act === 'remove') { c.status = 'removed'; render(); }
        if (b.dataset.act === 'delitem') { c.receipt.items.splice(Number(b.dataset.i), 1); render(); }
    });
    el('results').addEventListener('change', e => {
        const t = e.target, c = card(t.dataset.id);
        if (!c || !t.dataset.act) return;
        const r = c.receipt;
        if (t.dataset.act === 'section') {
            c.section = t.value;
            r.items.forEach(it => { it.category = categoryForSection(it.category, c.section, it.price); });
        }
        if (t.dataset.act === 'date') c.date = t.value;
        if (t.dataset.act === 'total') r.total = round2(parseFloat(t.value) || 0);
        if (t.dataset.act === 'litres') r.litres = parseFloat(t.value) || null;
        if (t.dataset.act === 'cat') r.items[Number(t.dataset.i)].category = t.value;
        if (t.dataset.act === 'price') r.items[Number(t.dataset.i)].price = round2(parseFloat(t.value) || 0);
        render();
    });

    window.addEventListener('beforeunload', e => {
        if (cards.some(c => ['queued', 'reading', 'ready', 'saving'].includes(c.status))) { e.preventDefault(); e.returnValue = ''; }
    });

    // ── start ─────────────────────────────────────────────────────────────
    (async () => {
        try {
            const meta = await fetch('/scan/sections').then(r => r.json());
            SECTIONS = meta.sections; ALIASES = meta.aliases;
        } catch { el('picked').innerHTML = '<span class="err">Couldn’t load the page settings — refresh to try again.</span>'; }
        try {
            const trips = await fetch('/trips').then(r => r.json());
            el('tripNames').innerHTML = (Array.isArray(trips) ? trips : []).map(t => `<option value="${esc(t.name)}">`).join('');
        } catch { /* trip suggestions are optional */ }
    })();
</script>
</body>
</html>
