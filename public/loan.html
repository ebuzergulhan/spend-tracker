    // ─── Load ────────────────────────────────────────────────────────
    async function load() {
        const loans = await fetch('/loans').then(r => r.json());
        if (!loans.length) { renderSetup(); return; }
        loan = loans[0];
        [schedule, transfers] = await Promise.all([
            fetch(`/loans/${loan.id}/schedule`).then(r => r.json()),
            fetch(`/loans/${loan.id}/transfers`).then(r => r.json())
        ]);
        renderTracker();
    }

    // ─── Setup screen ───────────────────────────────────────────────
    function renderSetup() {
        document.getElementById('main-content').innerHTML = `
            <div class="sp-card mb-4">
                <div class="sp-card-body">
                    <h2 style="font-size:18px;font-weight:700;color:var(--sp-ink);margin-bottom:4px;">Set Up Your Loan</h2>
                    <p style="font-size:13px;color:var(--sp-ink-50);margin-bottom:20px;">Enter your loan details or use the quick import below.</p>
                    <div class="flex flex-wrap gap-3 items-end mb-4">
                        <div class="flex-1 min-w-40">
                            <label class="sp-field-label">Loan Name</label>
                            <input id="s-name" value="UK Personal Loan" class="sp-input"/>
                        </div>
                        <div class="w-36">
                            <label class="sp-field-label">Original Amount</label>

                        <div class="w-36">

                        </div>
                    </div>
                    <div class="flex flex-wrap gap-3 items-end mb-4">
                        <div class="w-40">

                        </div>

                            <input id="s-end" type="date" value="2028-08-15" class="sp-input"/>

                        </div>
                    </div>
                    <div class="flex flex-wrap gap-3 items-end mb-6">
                        <div class="w-32">
                            <label class="sp-field-label">Annual Rate %</label>
                            <input id="s-annual" type="number" step="0.01" value="18.36" class="sp-input"/>
                        </div>
                        <div class="w-32">
                            <label class="sp-field-label">Monthly Rate %</label>
                            <input id="s-monthly-rate" type="number" step="0.01" value="1.53" class="sp-input"/>
                        </div>
                        <div class="w-40">
                            <label class="sp-field-label">Daily Rate (decimal)</label>
                            <input id="s-daily" type="number" step="0.0000000001" value="0.000503014" class="sp-input"/>
                        </div>
                    </div>
                    <button onclick="quickImport()" class="sp-btn-primary flex items-center gap-2" style="padding:10px 24px;">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>

    async function quickImport() {
        const btn = event.target.closest('button');
        btn.disabled = true; btn.textContent = 'Importing...';
        try {
            const loanRes = await fetch('/loans', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({
                    name: document.getElementById('s-name').value.trim(),
                    original_amount: document.getElementById('s-amount').value,
                    monthly_payment: document.getElementById('s-monthly').value,
                    start_date: document.getElementById('s-start').value,
                    end_date: document.getElementById('s-end').value,
                    total_installments: document.getElementById('s-install').value,
                    annual_rate: document.getElementById('s-annual').value,
                    monthly_rate: document.getElementById('s-monthly-rate').value,
                    daily_rate: document.getElementById('s-daily').value
                })
            });
            const newLoan = await loanRes.json();

            const schedRows = SCHEDULE_DATA.map(r => ({
                installment_no: r[0], due_date: r[1], opening_balance: r[2],
                interest: r[3], total_owed: r[4], payment: r[5], closing_balance: r[6]
            }));
            await fetch(`/loans/${newLoan.id}/schedule/bulk`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ rows: schedRows })
            });

            const transRows = TRANSFER_DATA.map(r => ({
                transfer_date: r[0], try_amount: r[1], google_rate: r[2],
                actual_rate: r[3], kambiyo_rate: 0.002, kambiyo_amount: r[4],
                try_after_tax: r[5], gbp_amount: r[6]
            }));
            await fetch(`/loans/${newLoan.id}/transfers/bulk`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ rows: transRows })
            });

            load();
        } catch (err) {
            alert('Import failed: ' + err.message);
            btn.disabled = false; btn.textContent = 'Import Loan + Schedule + Transfers';
        }
    }

    // ─── Tracker rendering ──────────────────────────────────────────
    function renderTracker() {
        const todayStr = today.toISOString().split('T')[0];
        const paidCount = schedule.filter(s => parseFloat(s.payment) > 0 && s.due_date.split('T')[0] <= todayStr).length;
        const totalPaid = schedule.filter(s => s.due_date.split('T')[0] <= todayStr).reduce((sum,s) => sum + parseFloat(s.payment), 0);
        const totalInterest = schedule.reduce((sum,s) => sum + parseFloat(s.interest), 0);
        const currentBalance = getCurrentBalance();
        const totalTry = transfers.reduce((s,t) => s + parseFloat(t.try_amount), 0);
        const totalGbpConverted = transfers.reduce((s,t) => s + parseFloat(t.gbp_amount), 0);
        const nextPayment = schedule.find(s => s.due_date.split('T')[0] > todayStr);
        const progress = ((parseFloat(loan.original_amount) - currentBalance) / parseFloat(loan.original_amount) * 100);

        let nextDueText = 'Completed';
        if (nextPayment) {
            const nd = new Date(nextPayment.due_date.split('T')[0] + 'T12:00:00');
            const diff = Math.round((nd - today) / 86400000);
            nextDueText = diff === 0 ? 'Due today!' : diff > 0 ? `In ${diff} days (${formatDate(nextPayment.due_date)})` : `Overdue by ${Math.abs(diff)} days`;
        }

        document.getElementById('main-content').innerHTML = `
            <!-- Overview card -->
            <div class="sp-card mb-4">
                <div class="sp-card-body">
                    <div class="flex items-start justify-between mb-4">
                        <div>
                            <h2 style="font-size:18px;font-weight:700;color:var(--sp-ink);">${loan.name}</h2>
                            <p style="font-size:12px;color:var(--sp-ink-50);margin-top:2px;">Started ${formatDate(loan.start_date)} &middot; Ends ${formatDate(loan.end_date)}</p>
                            <div class="flex gap-3 mt-1.5">
                                ${loan.annual_rate ? `<span style="font-size:12px;background:var(--sp-down-bg);color:var(--sp-down);padding:2px 8px;border-radius:999px;font-weight:500;">${parseFloat(loan.annual_rate)}% APR</span>` : ''}
                                ${loan.monthly_rate ? `<span style="font-size:12px;background:var(--sp-warn-bg);color:var(--sp-warn);padding:2px 8px;border-radius:999px;font-weight:500;">${parseFloat(loan.monthly_rate)}%/mo</span>` : ''}
                                ${loan.daily_rate ? `<span style="font-size:12px;background:var(--sp-panel);color:var(--sp-ink-50);padding:2px 8px;border-radius:999px;font-weight:500;">${parseFloat(loan.daily_rate).toFixed(6)}/day</span>` : ''}
                            </div>
                        </div>
                        <div class="text-right">
                            <p style="font-size:12px;color:var(--sp-ink-50);">Next payment</p>
                            <p style="font-size:13px;font-weight:600;color:${nextPayment ? 'var(--cat-debts-fg)' : 'var(--sp-up)'};">${nextDueText}</p>
                        </div>
                    </div>
                    <div class="mb-2 flex items-center justify-between" style="font-size:12px;color:var(--sp-ink-50);">
                        <span>Paid: ${fmt(totalPaid)}</span>
                        <span>Remaining: ${fmt(currentBalance)}</span>
                    </div>
                    <div class="w-full rounded-full h-3 mb-1" style="background:var(--sp-ink-08);">
                        <div class="h-3 rounded-full transition-all duration-700" style="width:${Math.min(progress,100).toFixed(1)}%;background:var(--cat-debts-dot);"></div>
                    </div>
                    <p style="font-size:12px;color:var(--sp-ink-50);text-align:center;">${progress.toFixed(1)}% paid &middot; ${paidCount} of ${schedule.length} payments made</p>
                </div>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                <div class="sp-kpi">
                    <div class="sp-kpi-label">Original Loan</div>
                    <div class="sp-kpi-value">${fmt(loan.original_amount)}</div>
                </div>
                <div class="sp-kpi">
                    <div class="sp-kpi-label">Balance</div>
                    <div class="sp-kpi-value">${fmt(currentBalance)}</div>
                </div>
                <div class="sp-kpi">
                    <div class="sp-kpi-label">Total Interest</div>
                    <div class="sp-kpi-value" style="color:var(--sp-down);">${fmt(totalInterest)}</div>
                </div>
                <div class="sp-kpi">
                    <div class="sp-kpi-label">TRY Converted</div>
                    <div class="sp-kpi-value">${fmt(totalGbpConverted)}</div>
                    <p style="font-size:12px;color:var(--sp-ink-50);">${fmtTry(totalTry)}</p>
                </div>
            </div>

            <!-- Tabs -->
            <div class="sp-card overflow-hidden mb-6">
                <div class="flex gap-2 px-6 pt-3 pb-0" style="border-bottom:1px solid var(--sp-ink-04);">
                    <button onclick="switchTab('schedule')" class="sp-pill ${activeTab==='schedule'?'sp-pill-active':''}" style="border-radius:8px 8px 0 0;">Payment Schedule</button>
                    <button onclick="switchTab('transfers')" class="sp-pill ${activeTab==='transfers'?'sp-pill-active':''}" style="border-radius:8px 8px 0 0;">TRY Transfers (${transfers.length})</button>
                </div>
                <div id="tab-content"></div>
            </div>
        `;

        if (activeTab === 'schedule') renderScheduleTab();
        else renderTransfersTab();
    }

    function getCurrentBalance() {
        const todayStr = today.toISOString().split('T')[0];
        for (let i = schedule.length - 1; i >= 0; i--) {
            if (schedule[i].due_date.split('T')[0] <= todayStr) {
                return parseFloat(schedule[i].closing_balance);
            }
        }
        return parseFloat(loan.original_amount);
    }

    function switchTab(tab) { activeTab = tab; renderTracker(); }

    // ─── Schedule tab ───────────────────────────────────────────────
    function renderScheduleTab() {
        const el = document.getElementById('tab-content');
        const todayStr = today.toISOString().split('T')[0];
        const currentIdx = schedule.findIndex(s => s.due_date.split('T')[0] > todayStr);

        let filtered = schedule;
        if (scheduleFilter === 'upcoming') filtered = schedule.filter(s => s.due_date.split('T')[0] >= todayStr);
        if (scheduleFilter === 'paid') filtered = schedule.filter(s => s.due_date.split('T')[0] < todayStr && parseFloat(s.payment) > 0);

        el.innerHTML = `
            <div class="px-6 py-3 flex items-center gap-3" style="border-bottom:1px solid var(--sp-ink-04);">
                <span style="font-size:12px;color:var(--sp-ink-50);">Show:</span>
                <button onclick="scheduleFilter='all';renderTracker()" class="sp-pill ${scheduleFilter==='all'?'sp-pill-active':''}" style="font-size:12px;">All (${schedule.length})</button>
                <button onclick="scheduleFilter='paid';renderTracker()" class="sp-pill ${scheduleFilter==='paid'?'sp-pill-active':''}" style="font-size:12px;">Paid</button>
                <button onclick="scheduleFilter='upcoming';renderTracker()" class="sp-pill ${scheduleFilter==='upcoming'?'sp-pill-active':''}" style="font-size:12px;">Upcoming</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr style="font-size:12px;color:var(--sp-ink-50);font-weight:500;border-bottom:1px solid var(--sp-ink-04);">
                            <th class="text-left px-6 py-2.5">#</th>
                            <th class="text-left py-2.5">Due Date</th>
                            <th class="text-right py-2.5">Balance</th>
                            <th class="text-right py-2.5">Interest</th>
                            <th class="text-right py-2.5">Payment</th>
                            <th class="text-right py-2.5">Remaining</th>
                            <th class="text-center py-2.5 pr-6">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filtered.map(s => {
                            const dueStr = s.due_date.split('T')[0];
                            const isPast = dueStr < todayStr;
                            const isCurrent = schedule[currentIdx]?.id === s.id;
                            const hasPmt = parseFloat(s.payment) > 0;
                            const isSkipped = isPast && !hasPmt;

                            let rowClass = '';
                            let badge = '';
                            if (isCurrent) {
                                rowClass = 'schedule-current';
                                badge = `<span style="font-size:12px;background:var(--cat-debts-bg);color:var(--cat-debts-fg);font-weight:600;padding:2px 8px;border-radius:999px;">Due</span>`;
                            } else if (isSkipped) {
                                rowClass = 'schedule-skipped';
                                badge = `<span style="font-size:12px;background:var(--sp-warn-bg);color:var(--sp-warn);font-weight:500;padding:2px 8px;border-radius:999px;">Skipped</span>`;
                            } else if (isPast && hasPmt) {
                                rowClass = 'schedule-paid';
                                badge = `<span style="font-size:12px;background:var(--sp-up-bg);color:var(--sp-up);font-weight:500;padding:2px 8px;border-radius:999px;">Paid</span>`;
                            } else {
                                badge = `<span style="font-size:12px;color:var(--sp-ink-30);">Upcoming</span>`;
                            }

                            return `<tr class="${rowClass}" style="border-bottom:1px solid var(--sp-ink-04);">
                                <td class="px-6 py-2.5" style="color:var(--sp-ink-50);font-weight:500;">${s.installment_no}</td>
                                <td class="py-2.5" style="color:var(--sp-ink);">${formatDate(s.due_date)}</td>
                                <td class="py-2.5 text-right" style="color:var(--sp-ink-50);">${fmt(s.opening_balance)}</td>
                                <td class="py-2.5 text-right" style="color:var(--sp-down);">${fmt(s.interest)}</td>
                                <td class="py-2.5 text-right" style="font-weight:600;color:${hasPmt ? 'var(--sp-ink)' : 'var(--sp-ink-30)'};">${hasPmt ? fmt(s.payment) : '—'}</td>
                                <td class="py-2.5 text-right" style="color:var(--sp-ink);">${fmt(s.closing_balance)}</td>
                                <td class="py-2.5 text-center pr-6">${badge}</td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>`;
    }

    // ─── Transfers tab ──────────────────────────────────────────────
    function renderTransfersTab() {
        const el = document.getElementById('tab-content');
        const totalTry = transfers.reduce((s,t) => s + parseFloat(t.try_amount), 0);
        const totalGbp = transfers.reduce((s,t) => s + parseFloat(t.gbp_amount), 0);
        const avgRate = transfers.length ? (totalTry / totalGbp).toFixed(2) : '—';

        el.innerHTML = `
            <div class="px-6 py-3 flex items-center justify-between" style="border-bottom:1px solid var(--sp-ink-04);">
                <div class="flex items-center gap-3">
                    <span style="font-size:12px;color:var(--sp-ink-50);">Avg rate: <strong style="color:var(--sp-ink);">${avgRate} TRY/GBP</strong></span>
                </div>
                <button onclick="showAddTransfer()" style="font-size:13px;font-weight:500;color:var(--cat-debts-fg);transition:opacity 0.15s;" onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='1'">+ Add Transfer</button>
            </div>
            <div id="add-transfer-panel" class="hidden"></div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr style="font-size:12px;color:var(--sp-ink-50);font-weight:500;border-bottom:1px solid var(--sp-ink-04);">
                            <th class="text-left px-6 py-2.5">Date</th>
                            <th class="text-right py-2.5">TRY Received</th>
                            <th class="text-right py-2.5">Google Rate</th>
                            <th class="text-right py-2.5">Actual Rate</th>
                            <th class="text-right py-2.5">Kambiyo</th>
                            <th class="text-right py-2.5">Net TRY</th>
                            <th class="text-right py-2.5">GBP</th>
                            <th class="text-right py-2.5 pr-6"></th>
                        </tr>
                    </thead>
                    <tbody>
                        ${transfers.map(t => {
                            if (editingTransferId === t.id) return transferEditRow(t);
                            return `<tr style="border-bottom:1px solid var(--sp-ink-04);transition:background 0.15s;" onmouseover="this.style.background='var(--sp-panel)'" onmouseout="this.style.background='transparent'">
                                <td class="px-6 py-2.5" style="color:var(--sp-ink);">${formatDate(t.transfer_date)}</td>
                                <td class="py-2.5 text-right" style="font-weight:500;color:var(--sp-ink);">${fmtTry(t.try_amount)}</td>
                                <td class="py-2.5 text-right" style="color:var(--sp-ink-50);">${parseFloat(t.google_rate).toFixed(2)}</td>
                                <td class="py-2.5 text-right" style="color:var(--sp-ink-50);">${parseFloat(t.actual_rate).toFixed(2)}</td>
                                <td class="py-2.5 text-right" style="color:var(--sp-down);">${fmtTry(t.kambiyo_amount)}</td>
                                <td class="py-2.5 text-right" style="color:var(--sp-ink-50);">${fmtTry(t.try_after_tax)}</td>
                                <td class="py-2.5 text-right" style="font-weight:700;color:var(--sp-up);">${fmt(t.gbp_amount)}</td>
                                <td class="py-2.5 text-right pr-6">
                                    <div class="flex items-center justify-end gap-1">
                                        <button onclick="editingTransferId=${t.id};renderTracker()" style="color:var(--sp-ink-30);transition:color 0.15s;padding:4px;" onmouseover="this.style.color='var(--cat-debts-fg)'" onmouseout="this.style.color='var(--sp-ink-30)'">${PENCIL}</button>
                                        <button onclick="deleteTransfer(${t.id})" style="color:var(--sp-ink-30);transition:color 0.15s;padding:4px;" onmouseover="this.style.color='var(--sp-down)'" onmouseout="this.style.color='var(--sp-ink-30)'">${TRASH}</button>
                                    </div>
                                </td>
                            </tr>`;
                        }).join('')}
                        <tr style="background:var(--sp-panel);font-weight:600;">
                            <td class="px-6 py-3" style="color:var(--sp-ink);">Total (${transfers.length} transfers)</td>
                            <td class="py-3 text-right" style="color:var(--sp-ink);">${fmtTry(totalTry)}</td>
                            <td colspan="4"></td>
                            <td class="py-3 text-right" style="color:var(--sp-up);">${fmt(totalGbp)}</td>
                            <td></td>
                        </tr>
                    </tbody>
                </table>
            </div>`;
    }

    function transferEditRow(t) {
        return `<tr style="background:var(--cat-debts-bg);border-bottom:1px solid var(--sp-ink-04);">
            <td colspan="8" class="px-6 py-3">
                <form onsubmit="saveTransferEdit(event,${t.id})" class="flex flex-wrap gap-2 items-end">
                    <div>
                        <label class="sp-field-label">Date</label>
                        <input id="te-date" type="date" value="${t.transfer_date.split('T')[0]}" class="sp-input" style="width:144px;"/>
                    </div>
                    <div>
                        <label class="sp-field-label">TRY Amount</label>
                        <input id="te-try" type="number" step="0.01" value="${t.try_amount}" class="sp-input" style="width:128px;" oninput="recalcEdit()"/>
                    </div>
                    <div>
                        <label class="sp-field-label">Google Rate</label>
                        <input id="te-google" type="number" step="0.01" value="${t.google_rate}" class="sp-input" style="width:96px;"/>
                    </div>
                    <div>
                        <label class="sp-field-label">Actual Rate</label>
                        <input id="te-actual" type="number" step="0.01" value="${t.actual_rate}" class="sp-input" style="width:96px;" oninput="recalcEdit()"/>
                    </div>
                    <div>
                        <label class="sp-field-label">Kambiyo %</label>
                        <input id="te-kambiyo" type="number" step="0.01" value="${(parseFloat(t.kambiyo_rate)*100).toFixed(2)}" class="sp-input" style="width:80px;" oninput="recalcEdit()"/>
                    </div>
                    <div>
                        <label class="sp-field-label">GBP Result</label>
                        <span id="te-result" style="font-size:13px;font-weight:700;color:var(--sp-up);display:block;padding:6px 0;">${fmt(t.gbp_amount)}</span>
                    </div>
                    <div class="flex gap-1">
                        <button type="submit" class="sp-btn-primary" style="font-size:12px;padding:6px 16px;">Save</button>
                        <button type="button" onclick="editingTransferId=null;renderTracker()" class="sp-btn-ghost" style="font-size:12px;padding:6px 12px;">Cancel</button>
                    </div>
                </form>
            </td>
        </tr>`;
    }

    function recalcEdit() {
        const tryAmt = parseFloat(document.getElementById('te-try')?.value) || 0;
        const rate = parseFloat(document.getElementById('te-actual')?.value) || 1;
        const kambiyoPct = parseFloat(document.getElementById('te-kambiyo')?.value) || 0;
        const tax = tryAmt * (kambiyoPct / 100);
        const net = tryAmt - tax;
        const gbp = rate > 0 ? net / rate : 0;
        const el = document.getElementById('te-result');
        if (el) el.textContent = fmt(gbp);
    }

    async function saveTransferEdit(e, id) {
        e.preventDefault();
        const tryAmt = parseFloat(document.getElementById('te-try').value);
        const rate = parseFloat(document.getElementById('te-actual').value);
        const kambiyoPct = parseFloat(document.getElementById('te-kambiyo').value) / 100;
        const tax = tryAmt * kambiyoPct;
        const net = tryAmt - tax;
        const gbp = rate > 0 ? net / rate : 0;

        await fetch('/loan-transfers/' + id, {
            method: 'PUT', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                transfer_date: document.getElementById('te-date').value,
                try_amount: tryAmt,
                google_rate: parseFloat(document.getElementById('te-google').value) || null,
                actual_rate: rate,
                kambiyo_rate: kambiyoPct,
                kambiyo_amount: Math.round(tax * 100) / 100,
                try_after_tax: Math.round(net * 100) / 100,
                gbp_amount: Math.round(gbp * 100) / 100
            })
        });
        editingTransferId = null;
        transfers = await fetch(`/loans/${loan.id}/transfers`).then(r => r.json());
        renderTracker();
    }

    async function deleteTransfer(id) {
        const ok = await showModal({ title: 'Delete', message: 'Remove this TRY transfer?', type: 'confirm', confirmLabel: 'Delete', cancelLabel: 'Cancel' });
        if (!ok) return;
        await fetch('/loan-transfers/' + id, { method: 'DELETE' });
        transfers = await fetch(`/loans/${loan.id}/transfers`).then(r => r.json());
        renderTracker();
    }

    // ─── Add new transfer ───────────────────────────────────────────
    function showAddTransfer() {
        const panel = document.getElementById('add-transfer-panel');
        panel.classList.remove('hidden');
        panel.innerHTML = `
            <div class="px-6 py-4" style="background:var(--cat-debts-bg);border-bottom:1px solid var(--sp-ink-04);">
                <p style="font-size:13px;font-weight:600;color:var(--sp-ink);margin-bottom:12px;">New TRY Transfer</p>
                <div class="flex flex-wrap gap-3 items-end">
                    <div>
                        <label class="sp-field-label">Date</label>
                        <input id="nt-date" type="date" value="${new Date().toISOString().split('T')[0]}" class="sp-input" style="width:144px;"/>
                    </div>
                    <div>
                        <label class="sp-field-label">TRY Amount</label>
                        <input id="nt-try" type="number" step="0.01" placeholder="50000" class="sp-input" style="width:128px;" oninput="recalcNew()"/>
                    </div>
                    <div>
                        <label class="sp-field-label">Google Rate</label>
                        <div class="flex gap-1">
                            <input id="nt-google" type="number" step="0.01" placeholder="58.00" class="sp-input" style="width:96px;"/>
                            <button onclick="fetchRate()" class="sp-btn-ghost" style="padding:6px;" title="Fetch current rate">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                            </button>
                        </div>
                    </div>
                    <div>
                        <label class="sp-field-label">Actual Rate</label>
                        <input id="nt-actual" type="number" step="0.01" placeholder="58.50" class="sp-input" style="width:96px;" oninput="recalcNew()"/>
                    </div>
                    <div>
                        <label class="sp-field-label">Kambiyo %</label>
                        <input id="nt-kambiyo" type="number" step="0.01" value="0.20" class="sp-input" style="width:80px;" oninput="recalcNew()"/>
                    </div>
                </div>
                <div class="flex items-center gap-4 mt-3">
                    <div class="flex-1">
                        <span style="font-size:12px;color:var(--sp-ink-50);">Tax: <strong id="nt-tax" style="color:var(--sp-ink);">—</strong></span>
                        <span style="font-size:12px;color:var(--sp-ink-50);margin-left:12px;">Net TRY: <strong id="nt-net" style="color:var(--sp-ink);">—</strong></span>
                        <span style="font-size:12px;color:var(--sp-ink-50);margin-left:12px;">GBP: <strong id="nt-gbp" style="color:var(--sp-up);font-size:13px;">—</strong></span>
                    </div>
                    <button onclick="saveNewTransfer()" class="sp-btn-primary" style="font-size:13px;padding:8px 20px;">Save</button>
                    <button onclick="document.getElementById('add-transfer-panel').classList.add('hidden')" class="sp-btn-ghost" style="font-size:13px;padding:8px 16px;">Cancel</button>
                </div>
            </div>`;
    }

    function recalcNew() {
        const tryAmt = parseFloat(document.getElementById('nt-try')?.value) || 0;
        const rate = parseFloat(document.getElementById('nt-actual')?.value) || 0;
        const kPct = parseFloat(document.getElementById('nt-kambiyo')?.value) || 0;
        const tax = tryAmt * (kPct / 100);
        const net = tryAmt - tax;
        const gbp = rate > 0 ? net / rate : 0;
        document.getElementById('nt-tax').textContent = fmtTry(tax);
        document.getElementById('nt-net').textContent = fmtTry(net);
        document.getElementById('nt-gbp').textContent = fmt(gbp);
    }

    async function fetchRate() {
        const btn = event.target.closest('button');
        btn.disabled = true;
        try {
            const data = await fetch('/api/exchange-rate').then(r => r.json());
            if (data.rate) {
                document.getElementById('nt-google').value = data.rate.toFixed(2);
                const actualEl = document.getElementById('nt-actual');
                if (!actualEl.value) actualEl.value = (data.rate * 1.01).toFixed(2);
                recalcNew();
            }
        } catch { alert('Could not fetch rate'); }
        btn.disabled = false;
    }

    async function saveNewTransfer() {
        const tryAmt = parseFloat(document.getElementById('nt-try').value);
        const rate = parseFloat(document.getElementById('nt-actual').value);
        const kPct = parseFloat(document.getElementById('nt-kambiyo').value) / 100;
        if (!tryAmt || !rate) { alert('Enter TRY amount and actual rate'); return; }
        const tax = tryAmt * kPct;
        const net = tryAmt - tax;
        const gbp = net / rate;

        await fetch(`/loans/${loan.id}/transfers`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                transfer_date: document.getElementById('nt-date').value,
                try_amount: tryAmt,
                google_rate: parseFloat(document.getElementById('nt-google').value) || null,
                actual_rate: rate,
                kambiyo_rate: kPct,
                kambiyo_amount: Math.round(tax * 100) / 100,
                try_after_tax: Math.round(net * 100) / 100,
                gbp_amount: Math.round(gbp * 100) / 100
            })
        });
        transfers = await fetch(`/loans/${loan.id}/transfers`).then(r => r.json());
        renderTracker();
    }

    load();
</script>
</body>
</html>
