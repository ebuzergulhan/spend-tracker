<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spend Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <div class="bg-white shadow mb-6">
        <div class="max-w-5xl mx-auto px-6 py-4 flex gap-6">
            <h1 class="text-2xl font-bold text-gray-800 mr-auto">Spend Tracker</h1>
            <button onclick="showTab('upload')" id="tab-upload" class="tab-btn font-medium text-blue-600 border-b-2 border-blue-600 pb-1">Upload</button>
            <button onclick="showTab('dashboard')" id="tab-dashboard" class="tab-btn font-medium text-gray-500 pb-1">Dashboard</button>
            <button onclick="showTab('history')" id="tab-history" class="tab-btn font-medium text-gray-500 pb-1">History</button>
        </div>
    </div>

    <div class="max-w-5xl mx-auto px-6">

        <!-- Upload Tab -->
        <div id="page-upload">
            <div class="bg-white rounded-2xl shadow p-6 mb-6 max-w-lg mx-auto">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Upload a Receipt</h2>
                <form id="uploadForm">
                    <input type="file" id="receiptImage" accept="image/*"
                        class="block w-full text-gray-600 border border-gray-300 rounded-lg p-2 mb-4" />
                    <button type="submit"
                        class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition">
                        Scan Receipt
                    </button>
                </form>
                <p id="loadingMsg" class="text-center text-gray-500 mt-4 hidden">Scanning receipt, please wait...</p>
            </div>

            <div id="resultCard" class="bg-white rounded-2xl shadow p-6 max-w-lg mx-auto hidden">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Scan Result</h2>
                <div id="resultContent"></div>
            </div>
        </div>

        <!-- Dashboard Tab -->
        <div id="page-dashboard" class="hidden">

            <!-- Monthly spending -->
            <div class="bg-white rounded-2xl shadow p-6 mb-6">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Monthly Spending</h2>
                <div id="monthlyStats"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <!-- By shop -->
                <div class="bg-white rounded-2xl shadow p-6">
                    <h2 class="text-xl font-semibold text-gray-700 mb-4">By Shop</h2>
                    <div id="shopStats"></div>
                </div>

                <!-- By category -->
                <div class="bg-white rounded-2xl shadow p-6">
                    <h2 class="text-xl font-semibold text-gray-700 mb-4">By Category</h2>
                    <div id="categoryStats"></div>
                </div>
            </div>

            <!-- Frequent items -->
            <div class="bg-white rounded-2xl shadow p-6 mb-6">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Items You Buy Most</h2>
                <div id="frequentItems"></div>
            </div>
        </div>

        <!-- History Tab -->
        <div id="page-history" class="hidden">
            <div class="bg-white rounded-2xl shadow p-6">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Receipt History</h2>
                <div id="historyContent"></div>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>

</html>
