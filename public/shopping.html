<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Shopping</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="spectrum.css"/>
    <style>
        .upload-area { border: 2px dashed var(--sp-ink-15); transition: all 0.2s ease; border-radius: 16px; }
        .upload-area:hover { border-color: var(--cat-shopping-dot); background: var(--cat-shopping-bg); }
    </style>
</head>
<body>

<div class="sp-shell">
  <main class="sp-main">
    <div class="sp-body">

      <!-- Tab pills -->
      <div class="flex gap-2 mb-4">
        <button onclick="showTab('upload')" id="tab-upload" class="sp-pill">Upload</button>
        <button onclick="showTab('history')" id="tab-history" class="sp-pill">History</button>
        <button onclick="showTab('stats')" id="tab-stats" class="sp-pill active">Dashboard</button>
      </div>

      <!-- Upload Tab -->
      <div id="page-upload" class="hidden">
        <div class="sp-card" style="max-width:480px;margin:0 auto;">
          <div class="sp-card-body" style="padding:32px;">
            <h2 style="font-size:18px;font-weight:600;color:var(--sp-ink);margin-bottom:24px;">Scan a Receipt</h2>
            <form id="uploadForm">
              <label class="upload-area p-8 flex flex-col items-center cursor-pointer block mb-4">
                <div style="width:56px;height:56px;border-radius:50%;background:var(--cat-shopping-bg);display:flex;align-items:center;justify-content:center;margin-bottom:12px;">
                  <svg style="width:28px;height:28px;color:var(--cat-shopping-fg);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                  </svg>
                </div>
                <p style="color:var(--sp-ink);font-weight:500;">Choose a receipt photo</p>
                <p style="color:var(--sp-ink-50);font-size:13px;margin-top:4px;">JPG, PNG up to 10MB</p>
                <input type="file" id="receiptImage" accept="image/*" class="hidden"/>
              </label>
              <p id="fileName" class="hidden" style="text-align:center;font-size:13px;color:var(--cat-shopping-fg);font-weight:500;margin-bottom:16px;"></p>
              <button type="submit" class="sp-btn-primary" style="width:100%;padding:12px;">Scan Receipt</button>
            </form>
            <div id="loadingMsg" class="hidden" style="margin-top:24px;display:flex;flex-direction:column;align-items:center;">
              <div style="width:32px;height:32px;border:3px solid var(--sp-ink-15);border-top-color:var(--cat-shopping-dot);border-radius:50%;margin-bottom:12px;" class="animate-spin"></div>
              <p style="color:var(--sp-ink-50);font-size:13px;">Reading your receipt...</p>
            </div>
          </div>
        </div>
        <div id="resultCard" class="hidden sp-card mt-4" style="max-width:480px;margin:16px auto 0;">
          <div class="sp-card-body">
            <div class="flex items-center gap-2 mb-4">
              <div style="width:32px;height:32px;border-radius:50%;background:var(--sp-down-bg);display:flex;align-items:center;justify-content:center;">
                <svg style="width:16px;height:16px;color:var(--sp-down);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
              </div>
              <h2 style="font-size:18px;font-weight:600;color:var(--sp-ink);">Receipt Scanned</h2>
            </div>
            <div id="resultContent"></div>
          </div>
        </div>
      </div>

      <!-- History Tab -->
      <div id="page-history" class="hidden">
        <div class="sp-card mb-6">
          <div class="sp-card-head"><div><h3 class="sp-card-title">Purchase History</h3></div></div>
          <div class="sp-card-body"><div id="historyContent"></div></div>
        </div>
      </div>

      <!-- Stats Tab -->
      <div id="page-stats">
        <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6 sp-grid-2">
          <div class="sp-kpi"><div class="sp-kpi-label">This Month</div><div class="sp-kpi-value" id="stat-month">—</div></div>
          <div class="sp-kpi"><div class="sp-kpi-label">Total Spent</div><div class="sp-kpi-value" id="stat-total">—</div></div>
          <div class="sp-kpi"><div class="sp-kpi-label">Orders</div><div class="sp-kpi-value" id="stat-orders">—</div></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <div class="sp-card">
            <div class="sp-card-head"><div><h3 class="sp-card-title">By Category</h3></div></div>
            <div class="sp-card-body"><div id="categoryStats"></div></div>
          </div>
          <div class="sp-card">
            <div class="sp-card-head"><div><h3 class="sp-card-title">By Store</h3></div></div>
            <div class="sp-card-body"><div id="placeStats"></div></div>
          </div>
        </div>
        <div class="sp-card mb-6">
          <div class="sp-card-head"><div><h3 class="sp-card-title">Monthly Spending</h3></div></div>
          <div class="sp-card-body"><div id="monthlyStats"></div></div>
        </div>
      </div>

      <!-- Installment Plans (always visible) -->
      <div class="sp-card mb-4" style="margin-top:24px;">
        <div class="sp-card-head"><div><h3 class="sp-card-title">Add Installment Plan</h3></div></div>
        <div class="sp-card-body">
          <form id="instForm" class="flex flex-wrap gap-3 items-end">
            <div class="flex-1 min-w-36">
              <label class="sp-field-label">Item name</label>
              <input type="text" id="if-name" placeholder="e.g. Samsung TV (Amazon)" required class="sp-input"/>
            </div>
            <div class="w-32">
              <label class="sp-field-label">Payment (&pound;)</label>
              <input type="number" id="if-amount" step="0.01" min="0" placeholder="0.00" required class="sp-input"/>
            </div>
            <div class="w-32">
              <label class="sp-field-label">No. of payments</label>
              <input type="number" id="if-installments" min="1" placeholder="e.g. 6" required class="sp-input"/>
            </div>
            <div class="w-36">
              <label class="sp-field-label">First payment date</label>
              <input type="date" id="if-start" required class="sp-input"/>
            </div>
            <div class="flex-1 min-w-36">
              <label class="sp-field-label">Notes</label>
              <input type="text" id="if-notes" placeholder="Optional" class="sp-input"/>
            </div>
            <div class="flex-1 min-w-48">
              <label class="sp-field-label">Link (optional)</label>
              <input type="url" id="if-link" placeholder="https://..." class="sp-input"/>
            </div>
            <button type="submit" class="sp-btn-primary">Add</button>
          </form>
        </div>
      </div>

      <div id="inst-section" class="hidden sp-card mb-6">
        <div class="sp-card-head"><div><h3 class="sp-card-title">Installment Plans</h3></div></div>
        <div class="sp-card-body"><div id="inst-list"></div></div>
      </div>

    </div>
  </main>
</div>

<script src="shared.js"></script>
<script src="spectrum-shell.js"></script>
<script>
    initSpectrum({
      active: 'shopping',
      title: 'Shopping',
      subtitle: 'Amazon, IKEA, clothing & online/in-store purchases',
    });

    function showTab(name) {
        ['upload','history','stats'].forEach(t => {
            document.getElementById('page-' + t).classList.toggle('hidden', t !== name);
            document.getElementById('tab-' + t).classList.toggle('active', t === name);
        });
        if (name === 'history') loadHistory();
        if (name === 'stats')   loadStats();
    }

    loadStats();

    // Upload
    const fileInput = document.getElementById('receiptImage');
    fileInput.onchange = () => {
        const el = document.getElementById('fileName');
        if (fileInput.files[0]) { el.textContent = fileInput.files[0].name; el.classList.remove('hidden'); }
    };

    document.getElementById('uploadForm').onsubmit = async e => {
        e.preventDefault();
        if (!fileInput.files[0]) { await showModal({ title: 'No file', message: 'Please choose a receipt photo first.', type: 'alert' }); return; }
        document.getElementById('loadingMsg').classList.remove('hidden');
        document.getElementById('resultCard').classList.add('hidden');

        const formData = new FormData();
        formData.append('receiptImage', fileInput.files[0]);

        try {
            const res = await fetch('/upload/shopping', { method: 'POST', body: formData });
            const data = await res.json();
            document.getElementById('loadingMsg').classList.add('hidden');

            if (!res.ok) {
                await showModal({ title: 'Error', message: data.error || 'Something went wrong.', type: 'alert' });
                return;
            }

            const card = document.getElementById('resultCard');
            const content = document.getElementById('resultContent');
            card.classList.remove('hidden');
            content.innerHTML = `
                <p style="font-size:13px;color:var(--sp-ink-50);margin-bottom:12px;">${data.place_name}${data.date ? ' &middot; ' + formatDate(data.date) : ''} &middot; ${fmt(data.total)}</p>
                <div class="space-y-1">
                    ${(data.items || []).map(i => `
                        <div class="flex justify-between" style="font-size:13px;">
                            <span style="color:var(--sp-ink-70);">${i.name} <span style="font-size:11px;color:var(--sp-ink-50);">${i.category}</span></span>
                            <span class="sp-num" style="font-weight:500;color:var(--sp-ink);">${fmt(i.price)}</span>
                        </div>
                    `).join('')}
                </div>
            `;
            e.target.reset();
            document.getElementById('fileName').classList.add('hidden');
        } catch (err) {
            document.getElementById('loadingMsg').classList.add('hidden');
            await showModal({ title: 'Error', message: err.message, type: 'alert' });
        }
    };

    // History
    let receipts = [];
    let expandedReceipt = null;
    const itemsCache = {};

    async function loadHistory() {
        receipts = await fetch('/shopping').then(r => r.json());
        renderHistory();
    }

    function renderHistory() {
        const el = document.getElementById('historyContent');
        if (!receipts.length) { el.innerHTML = '<p style="color:var(--sp-ink-50);font-size:13px;text-align:center;padding:24px 0;">No purchases yet.</p>'; return; }

        el.innerHTML = receipts.map(r => {
            const dateStr = r.date ? formatDate(r.date) : '<span style="color:var(--sp-ink-50);">* Date unread</span>';
            const isExpanded = expandedReceipt === r.created_at;
            return `
                <div style="border-bottom:1px solid var(--sp-ink-04);">
                    <div class="flex items-center gap-3" style="padding:12px 0;cursor:pointer;" onclick="toggleReceipt('${r.created_at}')">
                        <div class="flex-1">
                            <p style="font-size:13px;font-weight:500;color:var(--sp-ink);">${r.place_name}</p>
                            <p style="font-size:12px;color:var(--sp-ink-50);margin-top:2px;">${dateStr}</p>
                        </div>
                        <p class="sp-num" style="font-size:13px;font-weight:600;color:var(--sp-ink);">${fmt(r.receipt_total)}</p>
                        <svg style="width:16px;height:16px;color:var(--sp-ink-30);transition:transform 0.2s;${isExpanded ? 'transform:rotate(180deg);' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </div>
                    ${isExpanded ? expandedHtml(r) : ''}
                </div>
            `;
        }).join('');
    }

    function expandedHtml(r) {
        const items = itemsCache[r.created_at];
        if (!items) return '<div style="padding:12px 0;font-size:12px;color:var(--sp-ink-50);">Loading...</div>';
        const addedDate = new Date(r.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        return `
            <div style="margin-left:8px;padding-bottom:12px;" class="space-y-1">
                ${items.map(i => `
                    <div class="flex justify-between" style="font-size:13px;padding:4px 0;">
                        <span style="color:var(--sp-ink-70);">${parseFloat(i.quantity) > 1 ? `<span style="font-weight:600;color:var(--cat-shopping-fg);">${parseFloat(i.quantity) % 1 === 0 ? parseInt(i.quantity) : parseFloat(i.quantity)}x</span> ` : ''}${i.item_name} <span style="font-size:11px;color:var(--sp-ink-50);">${i.category}</span></span>
                        <span class="sp-num" style="color:var(--sp-ink-70);">${fmt(i.item_price)}</span>
                    </div>
                `).join('')}
                <p style="font-size:12px;color:var(--sp-ink-50);padding-top:8px;">Added ${addedDate}</p>
                <button onclick="deleteReceipt('${r.created_at}')" style="margin-top:8px;font-size:12px;color:var(--sp-up);display:flex;align-items:center;gap:4px;background:none;border:none;cursor:pointer;">
                    <svg style="width:14px;height:14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    Delete
                </button>
            </div>
        `;
    }

    async function toggleReceipt(createdAt) {
        if (expandedReceipt === createdAt) { expandedReceipt = null; renderHistory(); return; }
        expandedReceipt = createdAt;
        renderHistory();
        if (!itemsCache[createdAt]) {
            itemsCache[createdAt] = await fetch('/shopping/' + encodeURIComponent(createdAt) + '/items').then(r => r.json());
            renderHistory();
        }
    }

    async function deleteReceipt(createdAt) {
        const ok = await showModal({ title: 'Delete', message: 'Remove this purchase?', type: 'confirm', confirmLabel: 'Delete', cancelLabel: 'Cancel' });
        if (!ok) return;
        await fetch('/shopping/' + encodeURIComponent(createdAt), { method: 'DELETE' });
        delete itemsCache[createdAt];
        expandedReceipt = null;
        loadHistory();
    }

    // Installments
    let instItems = [];
    let instEditingId = null;

    const PENCIL = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>`;
    const TRASH  = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>`;
    const LINK_ICON = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>`;

    function freqMonths(freq) {
        if (freq === 'annual')    return 12;
        if (freq === 'quarterly') return 3;
        if (freq === 'weekly')    return 1 / 4.33;
        return 1;
    }

    function paidCount(item) {
        if (!item.start_date) return 0;
        const start = new Date(item.start_date);
        const now   = new Date();
        const monthsElapsed = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
        const paid = Math.floor(monthsElapsed / freqMonths(item.frequency)) + 1;
        return Math.max(0, Math.min(paid, parseInt(item.total_installments)));
    }

    function instEditForm(i) {
        const sd = i.start_date ? i.start_date.split('T')[0] : '';
        return `
            <div style="padding:12px 0;border-bottom:1px solid var(--sp-ink-04);">
                <form onsubmit="saveInst(event,${i.id})" style="background:var(--sp-panel);border-radius:12px;padding:12px;" class="space-y-2">
                    <div class="flex flex-wrap gap-2">
                        <input id="ii-name" value="${i.name}" placeholder="Name" required class="sp-input flex-1 min-w-32"/>
                        <input id="ii-amount" type="number" step="0.01" value="${i.amount}" placeholder="Payment" required class="sp-input w-28"/>
                        <input id="ii-inst" type="number" min="1" value="${i.total_installments||''}" placeholder="Payments" required class="sp-input w-24"/>
                        <input id="ii-start" type="date" value="${sd}" required class="sp-input w-36"/>
                        <input id="ii-notes" value="${i.notes||''}" placeholder="Notes" class="sp-input flex-1 min-w-32"/>
                        <input id="ii-link" value="${i.link||''}" placeholder="Link (optional)" class="sp-input flex-1 min-w-40"/>
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" class="sp-btn-primary" style="font-size:12px;padding:6px 16px;">Save</button>
                        <button type="button" onclick="instEditingId=null;renderInst()" class="sp-btn-ghost" style="font-size:12px;padding:6px 16px;">Cancel</button>
                    </div>
                </form>
            </div>`;
    }

    async function saveInst(e, id) {
        e.preventDefault();
        await fetch('/recurring/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: document.getElementById('ii-name').value.trim(),
                category: 'shopping',
                amount: document.getElementById('ii-amount').value,
                frequency: 'monthly',
                start_date: document.getElementById('ii-start').value || null,
                notes: document.getElementById('ii-notes').value.trim() || null,
                total_installments: parseInt(document.getElementById('ii-inst').value),
                link: document.getElementById('ii-link').value.trim() || null
            })
        });
        instEditingId = null;
        loadInst();
    }

    function instRow(i) {
        if (instEditingId === i.id) return instEditForm(i);
        const paid      = paidCount(i);
        const total     = parseInt(i.total_installments);
        const done      = paid >= total;
        const remaining = total - paid;
        const pct       = Math.round(paid / total * 100);
        return `
            <div style="padding:12px 0;border-bottom:1px solid var(--sp-ink-04);${done ? 'opacity:0.5;' : ''}">
                <div class="flex items-center gap-4">
                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <p style="font-size:13px;font-weight:500;color:var(--sp-ink);">${i.name}</p>
                            ${done ? '<span style="font-size:11px;background:var(--sp-down-bg);color:var(--sp-down);padding:2px 8px;border-radius:999px;font-weight:500;">Finished</span>' : ''}
                            ${i.link ? `<a href="${i.link}" target="_blank" rel="noopener" title="Open link" style="color:var(--sp-ink-30);" class="hover:opacity-70 transition" onclick="event.stopPropagation()">${LINK_ICON}</a>` : ''}
                        </div>
                        <p style="font-size:12px;color:var(--sp-ink-50);margin-top:2px;">Monthly${i.start_date ? ' &middot; from ' + formatDate(i.start_date) : ''}${i.notes ? ' &middot; ' + i.notes : ''}</p>
                        <div style="margin-top:8px;">
                            <div class="flex justify-between" style="font-size:12px;color:var(--sp-ink-50);margin-bottom:4px;">
                                <span>${paid} of ${total} paid${done ? ' &middot; <span style="color:var(--sp-down);font-weight:500;">Complete!</span>' : ''}</span>
                                <span>${remaining > 0 ? remaining + ' left' : ''}</span>
                            </div>
                            <div style="width:100%;background:var(--sp-ink-08);border-radius:999px;height:4px;">
                                <div style="height:4px;border-radius:999px;transition:width 0.7s;width:${pct}%;background:${done ? 'var(--sp-down)' : 'var(--cat-shopping-dot)'};"></div>
                            </div>
                        </div>
                    </div>
                    <div class="text-right" style="flex-shrink:0;">
                        <p class="sp-num" style="font-size:13px;font-weight:600;color:var(--sp-ink);">${fmt(i.amount)}<span style="font-size:11px;color:var(--sp-ink-50);font-weight:400;">/mo</span></p>
                    </div>
                    <button onclick="instEditingId=${i.id};renderInst()" style="color:var(--sp-ink-30);margin-left:8px;flex-shrink:0;" class="hover:opacity-70 transition">${PENCIL}</button>
                    <button onclick="deleteInst(${i.id})" style="color:var(--sp-ink-30);margin-left:4px;flex-shrink:0;" class="hover:opacity-70 transition">${TRASH}</button>
                </div>
            </div>
        `;
    }

    function renderInst() {
        const sec  = document.getElementById('inst-section');
        const list = document.getElementById('inst-list');
        if (!instItems.length) { sec.classList.add('hidden'); return; }
        sec.classList.remove('hidden');
        list.innerHTML = instItems.map(instRow).join('');
    }

    async function loadInst() {
        instItems = await fetch('/recurring?category=shopping').then(r => r.json());
        renderInst();
    }

    document.getElementById('instForm').onsubmit = async e => {
        e.preventDefault();
        await fetch('/recurring', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: document.getElementById('if-name').value.trim(),
                category: 'shopping',
                amount: document.getElementById('if-amount').value,
                frequency: 'monthly',
                start_date: document.getElementById('if-start').value || null,
                notes: document.getElementById('if-notes').value.trim() || null,
                total_installments: parseInt(document.getElementById('if-installments').value),
                link: document.getElementById('if-link').value.trim() || null
            })
        });
        e.target.reset();
        loadInst();
    };

    async function deleteInst(id) {
        const ok = await showModal({ title: 'Delete', message: 'Remove this installment plan?', type: 'confirm', confirmLabel: 'Delete', cancelLabel: 'Cancel' });
        if (!ok) return;
        await fetch('/recurring/' + id, { method: 'DELETE' });
        loadInst();
    }

    loadInst();

    // Stats
    async function loadStats() {
        const now = new Date();
        const monthStart = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
        const monthEnd   = new Date(now.getFullYear(), now.getMonth()+1, 0).toISOString().split('T')[0];

        const [allReceipts, monthCats, cats, places] = await Promise.all([
            fetch('/shopping').then(r => r.json()),
            fetch(`/stats/shopping/categories?from=${monthStart}&to=${monthEnd}`).then(r => r.json()),
            fetch('/stats/shopping/categories').then(r => r.json()),
            fetch('/stats/shopping/places').then(r => r.json())
        ]);

        const monthTotal = monthCats.reduce((s, c) => s + parseFloat(c.total_spent), 0);
        const allTotal   = allReceipts.reduce((s, r) => s + parseFloat(r.receipt_total), 0);
        document.getElementById('stat-month').textContent  = fmt(monthTotal);
        document.getElementById('stat-total').textContent  = fmt(allTotal);
        document.getElementById('stat-orders').textContent = allReceipts.length;

        const maxCat = Math.max(...cats.map(c => parseFloat(c.total_spent)), 1);
        document.getElementById('categoryStats').innerHTML = cats.length ? cats.map(c => `
            <div class="flex items-center gap-3 mb-3">
                <span style="font-size:13px;color:var(--sp-ink-70);width:128px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${c.category}</span>
                <div class="flex-1" style="background:var(--sp-ink-08);border-radius:999px;height:4px;">
                    <div style="height:4px;border-radius:999px;width:${(parseFloat(c.total_spent)/maxCat*100).toFixed(1)}%;background:var(--cat-shopping-dot);transition:width 0.7s;"></div>
                </div>
                <span class="sp-num" style="font-size:13px;font-weight:500;color:var(--sp-ink);width:64px;text-align:right;">${fmt(c.total_spent)}</span>
            </div>
        `).join('') : '<p style="color:var(--sp-ink-50);font-size:13px;">No data yet.</p>';

        const maxPlace = Math.max(...places.map(p => parseFloat(p.total_spent)), 1);
        document.getElementById('placeStats').innerHTML = places.length ? places.map(p => `
            <div class="flex items-center gap-3 mb-3">
                <span style="font-size:13px;color:var(--sp-ink-70);width:128px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.place_name}</span>
                <div class="flex-1" style="background:var(--sp-ink-08);border-radius:999px;height:4px;">
                    <div style="height:4px;border-radius:999px;width:${(parseFloat(p.total_spent)/maxPlace*100).toFixed(1)}%;background:var(--cat-shopping-dot);opacity:0.7;transition:width 0.7s;"></div>
                </div>
                <span class="sp-num" style="font-size:13px;font-weight:500;color:var(--sp-ink);width:64px;text-align:right;">${fmt(p.total_spent)}</span>
            </div>
        `).join('') : '<p style="color:var(--sp-ink-50);font-size:13px;">No data yet.</p>';

        // Monthly spending grouped from allReceipts
        const monthMap = {};
        allReceipts.forEach(r => {
            const m = (r.date || r.created_at || '').slice(0, 7);
            if (m) monthMap[m] = (monthMap[m] || 0) + parseFloat(r.receipt_total);
        });
        const monthlyArr = Object.entries(monthMap).sort((a,b) => b[0].localeCompare(a[0]));
        const maxMonth = Math.max(...monthlyArr.map(([,v]) => v), 1);
        document.getElementById('monthlyStats').innerHTML = monthlyArr.length ? monthlyArr.map(([m, v]) => {
            const [y, mo] = m.split('-');
            const label = new Date(y, mo - 1).toLocaleString('en-GB', { month: 'short', year: 'numeric' });
            return `
                <div class="flex items-center gap-3 mb-3">
                    <span style="font-size:13px;color:var(--sp-ink-70);width:80px;flex-shrink:0;">${label}</span>
                    <div class="flex-1" style="background:var(--sp-ink-08);border-radius:999px;height:4px;">
                        <div style="height:4px;border-radius:999px;width:${(v/maxMonth*100).toFixed(1)}%;background:var(--cat-shopping-dot);opacity:0.8;transition:width 0.7s;"></div>
                    </div>
                    <span class="sp-num" style="font-size:13px;font-weight:500;color:var(--sp-ink);width:64px;text-align:right;">${fmt(v)}</span>
                </div>
            `;
        }).join('') : '<p style="color:var(--sp-ink-50);font-size:13px;">No data yet.</p>';
    }
</script>
</body>
</html>
