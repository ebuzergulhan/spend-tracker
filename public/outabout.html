<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Out & About</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="spectrum.css"/>
</head>
<body>

<div class="sp-shell">
  <main class="sp-main">
    <div class="sp-body">

      <!-- Tab pills -->
      <div class="flex gap-2 mb-6 flex-wrap">
        <button onclick="showTab('stats')" id="tab-stats" class="sp-pill sp-pill-active">Dashboard</button>
        <button onclick="showTab('upload')" id="tab-upload" class="sp-pill">Upload</button>
        <button onclick="showTab('manual')" id="tab-manual" class="sp-pill">Manual Entry</button>
        <button onclick="showTab('history')" id="tab-history" class="sp-pill">History</button>
      </div>

      <!-- Dashboard Tab -->
      <div id="page-stats">
        <div id="report"></div>
      </div>

      <!-- Upload Tab -->
      <div id="page-upload" class="hidden">
        <a href="scan.html" class="sp-card max-w-lg mx-auto block mb-4" style="text-decoration:none;color:inherit;">
          <div class="sp-card-body" style="display:flex;align-items:center;gap:12px;">
            <div style="flex:1;">
              <p style="font-size:14px;font-weight:600;color:var(--sp-ink);">Several receipts? Use Scan receipts</p>
              <p style="font-size:12px;color:var(--sp-ink-50);margin-top:2px;">Take up to 10 photos in a row with the camera, check each one, then save.</p>
            </div>
            <span style="font-size:18px;color:var(--sp-ink-50);">→</span>
          </div>
        </a>
        <div class="sp-card max-w-lg mx-auto">
          <div class="sp-card-head"><div><h3 class="sp-card-title">Scan a Receipt</h3></div></div>
          <div class="sp-card-body">
            <form id="uploadForm">
              <label class="rounded-2xl p-8 flex flex-col items-center cursor-pointer block mb-4" style="border:2px dashed var(--sp-ink-08);transition:all 0.2s;" onmouseover="this.style.borderColor='var(--cat-outabout-dot)';this.style.background='var(--cat-outabout-bg)'" onmouseout="this.style.borderColor='var(--sp-ink-08)';this.style.background='transparent'">
                <div class="w-14 h-14 rounded-full flex items-center justify-center mb-3" style="background:var(--cat-outabout-bg);">
                  <svg class="w-7 h-7" style="color:var(--cat-outabout-fg);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                  </svg>
                </div>
                <p style="font-size:14px;font-weight:500;color:var(--sp-ink);">Choose a receipt photo</p>
                <p style="font-size:13px;color:var(--sp-ink-50);margin-top:4px;">The photo is kept with the receipt</p>
                <input type="file" id="receiptImage" accept="image/*" class="hidden"/>
              </label>
              <p id="fileName" class="text-center text-sm font-medium mb-4 hidden" style="color:var(--cat-outabout-fg);"></p>
              <div class="mb-4">
                <label class="sp-field-label">Trip / Event name <span style="color:var(--sp-ink-50);font-weight:normal;">(optional — groups receipts together)</span></label>
                <input type="text" id="tripName" placeholder="e.g. Oxford Trip" class="sp-input" list="tripList"/>
              </div>
              <button type="submit" class="sp-btn-primary w-full" style="padding:12px;">Scan Receipt</button>
            </form>
            <div id="loadingMsg" class="hidden mt-6 flex flex-col items-center">
              <div class="w-8 h-8 rounded-full animate-spin mb-3" style="border:3px solid var(--sp-ink-08);border-top-color:var(--cat-outabout-dot);"></div>
              <p style="font-size:13px;color:var(--sp-ink-50);">Reading your receipt...</p>
            </div>
          </div>
        </div>
        <div id="resultCard" class="sp-card max-w-lg mx-auto mt-4 hidden">
          <div class="sp-card-body">
            <div class="flex items-center gap-2 mb-4">
              <div class="w-8 h-8 rounded-full flex items-center justify-center" style="background:var(--sp-down-bg);">
                <svg class="w-4 h-4" style="color:var(--sp-down);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
              </div>
              <h2 style="font-size:16px;font-weight:600;color:var(--sp-ink);">Receipt Scanned</h2>
            </div>
            <div id="resultContent"></div>
          </div>
        </div>
      </div>

      <!-- Manual Tab -->
      <div id="page-manual" class="hidden">
        <div class="sp-card max-w-lg mx-auto">
          <div class="sp-card-head"><div><h3 class="sp-card-title">Add Expense Manually</h3></div></div>
          <div class="sp-card-body">
            <form id="manualForm" class="space-y-4">
              <div>
                <label class="sp-field-label">Place / Description</label>
                <input type="text" id="m-name" placeholder="e.g. Nando's" required class="sp-input"/>
              </div>
              <div class="flex gap-3">
                <div class="flex-1">
                  <label class="sp-field-label">Amount (&pound;)</label>
                  <input type="number" id="m-amount" step="0.01" min="0" placeholder="0.00" required class="sp-input"/>
                </div>
                <div class="flex-1">
                  <label class="sp-field-label">Date</label>
                  <input type="date" id="m-date" required class="sp-input"/>
                </div>
              </div>
              <div>
                <label class="sp-field-label">Category</label>
                <select id="m-category" class="sp-select">
                  <option>Restaurant</option>
                  <option>Fast Food</option>
                  <option>Coffee & Drinks</option>
                  <option>Parking</option>
                  <option>Entertainment</option>
                  <option>Shopping</option>
                  <option>Health & Beauty</option>
                  <option>Hotel</option>
                  <option>Transport</option>
                  <option>Other</option>
                </select>
              </div>
              <div>
                <label class="sp-field-label">Trip / Event name <span style="color:var(--sp-ink-50);font-weight:normal;">(optional)</span></label>
                <input type="text" id="m-trip" placeholder="e.g. Oxford Trip" class="sp-input" list="tripList"/>
              </div>
              <button type="submit" class="sp-btn-primary w-full" style="padding:12px;">Add Expense</button>
            </form>
          </div>
        </div>
      </div>

      <!-- History Tab -->
      <div id="page-history" class="hidden">
        <div class="sp-card mb-6">
          <div class="sp-card-head"><div><h3 class="sp-card-title">Receipt History</h3><div class="sp-card-sub">Newest first · tap a receipt to see, edit or delete it</div></div></div>
          <div class="sp-card-body"><div id="historyContent"></div></div>
        </div>
      </div>

      <datalist id="tripList"></datalist>
    </div>
  </main>
</div>

<script src="shared.js"></script>
<script src="spectrum-shell.js"></script>
<script src="report-logic.js"></script>
<script src="report-view.js"></script>
<script src="receipt-history.js"></script>
<script>
    initSpectrum({
      active: 'outabout',
      title: 'Out & About',
      subtitle: 'Restaurants, coffee, parking & more',
    });

    const TABS = ['stats', 'upload', 'manual', 'history'];
    const report = ReportView.mount(document.getElementById('report'), { section: 'outabout', showPlaces: true, showCategories: true });
    const historyView = ReceiptHistory.mount(document.getElementById('historyContent'), {
        section: 'outabout', base: '/outings', groupTrips: true, onChange: () => report.reload() });

    function showTab(name) {
        TABS.forEach(t => {
            document.getElementById('page-' + t).classList.toggle('hidden', t !== name);
            document.getElementById('tab-' + t).classList.toggle('sp-pill-active', t === name);
        });
        if (name === 'history') historyView.load();
        if (name === 'stats') report.reload();
    }

    fetch('/trips').then(r => r.json()).then(t => {
        document.getElementById('tripList').innerHTML = (Array.isArray(t) ? t : []).map(x => `<option value="${String(x.name).replace(/"/g, '&quot;')}">`).join('');
    }).catch(() => {});

    // ── Upload ─────────────────────────────────────────────────────────────
    const fileInput = document.getElementById('receiptImage');
    fileInput.onchange = () => {
        const el = document.getElementById('fileName');
        if (fileInput.files[0]) { el.textContent = fileInput.files[0].name; el.classList.remove('hidden'); }
    };

    document.getElementById('uploadForm').onsubmit = async e => {
        e.preventDefault();
        if (!fileInput.files[0]) { await showModal({ title: 'No file', message: 'Please choose a receipt photo first.', type: 'alert' }); return; }
        document.getElementById('loadingMsg').classList.remove('hidden');
        document.getElementById('resultCard').classList.add('hidden');

        const formData = new FormData();
        formData.append('receiptImage', await shrinkImage(fileInput.files[0], 2000));
        const tripName = document.getElementById('tripName').value.trim();
        if (tripName) formData.append('trip_name', tripName);

        try {
            const res = await fetch('/upload/outing', { method: 'POST', body: formData });
            const data = await res.json();
            document.getElementById('loadingMsg').classList.add('hidden');

            if (!res.ok) {
                await showModal({ title: 'Error', message: data.error || 'Something went wrong.', type: 'alert' });
                return;
            }

            const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const card = document.getElementById('resultCard');
            const content = document.getElementById('resultContent');
            card.classList.remove('hidden');
            content.innerHTML = `
                <p style="font-size:13px;color:var(--sp-ink-50);margin-bottom:12px;">${esc(data.place_name)}${data.date ? ' · ' + formatDate(data.date) : ''} · ${fmt(data.total)}${tripName ? ' · <span style="color:var(--cat-outabout-fg);font-weight:500;">' + esc(tripName) + '</span>' : ''}</p>
                <div class="space-y-1">
                    ${(data.items || []).map(i => `
                        <div class="flex justify-between text-sm">
                            <span style="color:var(--sp-ink);">${esc(i.name)} <span style="color:var(--sp-ink-50);font-size:12px;">${esc(i.category)}</span></span>
                            <span class="sp-num" style="font-weight:500;color:var(--sp-ink);">${fmt(i.price)}</span>
                        </div>
                    `).join('')}
                </div>
                <p style="font-size:12px;color:var(--sp-ink-50);margin-top:12px;">Saved. Anything wrong? Fix it in History → Edit receipt.</p>
            `;
            e.target.reset();
            document.getElementById('fileName').classList.add('hidden');
            report.reload();
        } catch (err) {
            document.getElementById('loadingMsg').classList.add('hidden');
            await showModal({ title: 'Error', message: err.message, type: 'alert' });
        }
    };

    // ── Manual entry ───────────────────────────────────────────────────────
    const todayLocal = () => new Date().toLocaleDateString('en-CA');
    document.getElementById('m-date').value = todayLocal();

    document.getElementById('manualForm').onsubmit = async e => {
        e.preventDefault();
        await fetch('/outings/manual', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                place_name: document.getElementById('m-name').value.trim(),
                amount:     document.getElementById('m-amount').value,
                category:   document.getElementById('m-category').value,
                date:       document.getElementById('m-date').value,
                trip_name:  document.getElementById('m-trip').value.trim() || null
            })
        });
        e.target.reset();
        document.getElementById('m-date').value = todayLocal();
        report.reload();
        await showModal({ title: 'Added', message: 'Expense saved.', type: 'alert', confirmLabel: 'OK' });
    };
</script>
</body>
</html>
