        stroke="white" stroke-width="54" stroke-linecap="round" fill="none"/>
  <!-- Crossbar -->
  <line x1="122" y1="272" x2="312" y2="272"
        stroke="white" stroke-width="50" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="122" y1="404" x2="378" y2="404"
        stroke="white" stroke-width="50" stroke-linecap="round"/>
</svg>
