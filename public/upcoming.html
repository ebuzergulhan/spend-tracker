<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Upcoming Payments</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="spectrum.css"/>
</head>
<body>

<div class="sp-shell">
  <main class="sp-main">
    <div class="sp-body">

      <!-- Tab pills -->
      <div class="flex gap-2 mb-4">
        <button onclick="showTab('this')" id="tab-this" class="sp-pill active"></button>
        <button onclick="showTab('next')" id="tab-next" class="sp-pill"></button>
      </div>

      <!-- Grand total card -->
      <div class="sp-card mb-4">
        <div class="sp-card-body">
          <div class="flex items-center justify-between">
            <div>
              <p class="sp-kpi-label" id="total-label">Total this month</p>
              <p class="sp-num" id="grand-total" style="font-size:28px;font-weight:700;letter-spacing:-1px;margin-top:4px;">—</p>
            </div>
            <div class="text-right">
              <p class="sp-kpi-label">Recurring due</p>
              <p class="sp-num" id="recurring-total" style="font-size:18px;font-weight:700;color:var(--sp-ink);margin-top:4px;">—</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Month breakdown -->
      <div class="sp-card mb-4" style="overflow:hidden">
        <div class="sp-card-head">
          <div>
            <h3 class="sp-card-title">Month Breakdown</h3>
          </div>
        </div>
        <div id="breakdown-list"></div>
      </div>

      <!-- Payment schedule -->
      <div class="sp-card mb-6">
        <div class="sp-card-head">
          <div>
            <h3 class="sp-card-title">Payment Schedule</h3>
            <div class="sp-card-sub">Recurring items sorted by due date</div>
          </div>
        </div>
        <div class="sp-card-body">
          <div id="payments-list">
            <p style="color:var(--sp-ink-50);font-size:13px;text-align:center;padding:32px 0;">Loading...</p>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="shared.js"></script>
<script src="spectrum-shell.js"></script>
<script>
    initSpectrum({
      active: 'upcoming',
      title: 'Upcoming Payments',
      subtitle: 'Scheduled payments & month overview',
    });

    const today = new Date();
    today.setHours(12, 0, 0, 0);
    let currentTab = 'this';
    let expandedCat = null;

    const SECTIONS = [
        { key: 'groceries',     label: 'Groceries',     href: 'index.html',         type: 'actual' },
        { key: 'outabout',      label: 'Out & About',   href: 'outabout.html',       type: 'actual' },
        { key: 'fixed',         label: 'Home Costs',    href: 'fixed.html',          type: 'recurring', cat: 'fixed' },
        { key: 'bills',         label: 'Bills',         href: 'bills.html',          type: 'recurring', cat: 'bills' },
        { key: 'transport',     label: 'Transport',     href: 'transport.html',      type: 'recurring', cat: 'transport' },
        { key: 'subscriptions', label: 'Subscriptions', href: 'subscriptions.html',  type: 'recurring', cat: 'subscription' },
        { key: 'shopping',      label: 'Shopping',      href: 'shopping.html',       type: 'actual' },
    ];

    function monthLabel(year, month) {
        return new Date(year, month - 1, 1).toLocaleString('en-GB', { month: 'long', year: 'numeric' });
    }

    function getMonthBounds(offset) {
        const d = new Date(today.getFullYear(), today.getMonth() + offset, 1);
        return { year: d.getFullYear(), month: d.getMonth() + 1 };
    }

    function computePayments(recurring, year, month) {
        const payments = [];
        const daysInMonth = new Date(year, month, 0).getDate();

        recurring.forEach(item => {
            if (!item.amount || parseFloat(item.amount) <= 0) return;
            if (!item.start_date) return;

            const start = new Date(item.start_date.split('T')[0] + 'T12:00:00');
            const startYear  = start.getFullYear();
            const startMonth = start.getMonth() + 1;
            const dueDay     = start.getDate();
            const freq       = item.frequency || 'monthly';

            if (year < startYear || (year === startYear && month < startMonth)) return;

            if (item.total_installments) {
                const monthsElapsed = (year - startYear) * 12 + (month - startMonth);
                if (monthsElapsed >= parseInt(item.total_installments)) return;
            }

            let isDue = false;
            let dueDays = [];

            if (freq === 'monthly') {
                isDue = true;
            } else if (freq === 'annual') {
                isDue = (start.getMonth() + 1 === month && start.getFullYear() <= year);
            } else if (freq === 'quarterly') {
                const diff = (year - startYear) * 12 + (month - startMonth);
                isDue = diff >= 0 && diff % 3 === 0;
            } else if (freq === 'weekly') {
                const startOfMonth = new Date(year, month - 1, 1);
                const endOfMonth   = new Date(year, month - 1, daysInMonth);
                let d = new Date(start);
                while (d <= endOfMonth) {
                    if (d >= startOfMonth) dueDays.push(d.getDate());
                    d = new Date(d.getTime() + 7 * 24 * 60 * 60 * 1000);
                }
            }

            if (freq === 'weekly') {
                dueDays.forEach(day => payments.push(makePayment(item, day, year, month)));
            } else if (isDue) {
                payments.push(makePayment(item, Math.min(dueDay, daysInMonth), year, month));
            }
        });

        return payments.sort((a, b) => a.day - b.day);
    }

    function makePayment(item, day, year, month) {
        const dateStr  = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const date     = new Date(dateStr + 'T12:00:00');
        const diffDays = Math.round((date - today) / 86400000);
        return { name: item.name, category: item.category, amount: parseFloat(item.amount), day, dateStr, date, diffDays };
    }

    function recurringTotalForMonth(recurring, year, month) {
        return computePayments(recurring, year, month).reduce((s, p) => s + p.amount, 0);
    }

    let allRecurring = [];
    let homeData = null;

    async function load() {
        const thisM = getMonthBounds(0);
        const nextM = getMonthBounds(1);
        document.getElementById('tab-this').textContent = monthLabel(thisM.year, thisM.month);
        document.getElementById('tab-next').textContent = monthLabel(nextM.year, nextM.month);

        [allRecurring, homeData] = await Promise.all([
            fetch('/recurring').then(r => r.json()),
            fetch('/summary/home').then(r => r.json())
        ]);

        renderTab();
    }

    function showTab(name) {
        currentTab = name;
        expandedCat = null;
        document.getElementById('tab-this').classList.toggle('active', name === 'this');
        document.getElementById('tab-next').classList.toggle('active', name === 'next');
        renderTab();
    }

    function renderTab() {
        const offset = currentTab === 'this' ? 0 : 1;
        const { year, month } = getMonthBounds(offset);
        const isThisMonth = offset === 0;
        const payments = computePayments(allRecurring, year, month);
        renderBreakdown(isThisMonth, year, month, payments);
        renderPayments(payments, isThisMonth);
    }

    function renderBreakdown(isThisMonth, year, month, payments) {
        const recurringBySection = {};
        SECTIONS.forEach(s => {
            if (s.type === 'recurring') {
                recurringBySection[s.key] = payments
                    .filter(p => p.category === s.cat)
                    .reduce((sum, p) => sum + p.amount, 0);
            }
        });

        const values = {
            groceries:     isThisMonth ? (homeData?.groceries     || 0) : 0,
            outabout:      isThisMonth ? (homeData?.outabout      || 0) : 0,
            fixed:         isThisMonth ? (homeData?.fixed         || 0) : (recurringBySection.fixed         || 0),
            bills:         isThisMonth ? (homeData?.bills         || 0) : (recurringBySection.bills         || 0),
            transport:     isThisMonth ? (homeData?.transport     || 0) : (recurringBySection.transport     || 0),
            subscriptions: isThisMonth ? (homeData?.subscriptions || 0) : (recurringBySection.subscriptions || 0),
            shopping:      isThisMonth ? (homeData?.shopping      || 0) : 0,
        };

        const recurringDue = payments.reduce((s, p) => s + p.amount, 0);
        const grandTotal   = Object.values(values).reduce((s, v) => s + v, 0);

        document.getElementById('grand-total').textContent   = fmt(grandTotal);
        document.getElementById('recurring-total').textContent = fmt(recurringDue);
        document.getElementById('total-label').textContent   =
            isThisMonth ? 'Total this month (actual + recurring)' : 'Recurring total next month';

        const maxVal = Math.max(...Object.values(values), 1);
        const sorted = [...SECTIONS].sort((a, b) => (values[b.key] || 0) - (values[a.key] || 0));

        const html = sorted.map(s => {
            const val     = values[s.key] || 0;
            const pct     = (val / maxVal * 100).toFixed(1);
            const isOpen  = expandedCat === s.key;
            const isEmpty = val === 0;

            let subItems = '';
            if (isOpen && s.type === 'recurring') {
                const items = allRecurring.filter(r => r.category === s.cat);
                const activeItems = items.filter(r => {
                    if (!r.start_date) return false;
                    const start = new Date(r.start_date.split('T')[0] + 'T12:00:00');
                    const sy = start.getFullYear(), sm = start.getMonth() + 1;
                    if (year < sy || (year === sy && month < sm)) return false;
                    if (r.total_installments) {
                        const elapsed = (year - sy) * 12 + (month - sm);
                        if (elapsed >= parseInt(r.total_installments)) return false;
                    }
                    return true;
                });
                const recurringAmt = recurringBySection[s.key] || 0;
                const oneTimeAmt   = isThisMonth ? Math.max(0, (values[s.key] || 0) - recurringAmt) : 0;
                subItems = `<div style="background:var(--sp-panel);padding:12px 24px;" class="space-y-2">
                    ${activeItems.length ? activeItems.map(r => `
                        <div class="flex items-center justify-between" style="font-size:13px;">
                            <span style="color:var(--sp-ink-70)">${r.name}</span>
                            <span style="font-weight:500;color:var(--sp-ink)"><span class="sp-num">${fmt(r.amount)}</span><span style="font-size:11px;color:var(--sp-ink-50);font-weight:400">/${r.frequency === 'annual' ? 'yr' : r.frequency === 'quarterly' ? 'qtr' : 'mo'}</span></span>
                        </div>`).join('')
                    : '<p style="font-size:12px;color:var(--sp-ink-50)">No recurring items this month.</p>'}
                    ${oneTimeAmt > 0 ? `
                        <div class="flex items-center justify-between" style="font-size:13px;padding-top:8px;margin-top:4px;border-top:1px solid var(--sp-ink-08);">
                            <span style="color:var(--sp-ink-50);font-style:italic">One-time payments this month</span>
                            <span class="sp-num" style="font-weight:500;color:var(--sp-ink)">${fmt(oneTimeAmt)}</span>
                        </div>` : ''}
                    <a href="${s.href}" style="font-size:12px;color:var(--sp-ink-70);display:block;padding-top:4px;text-decoration:none;">View all ${s.label} &rarr;</a>
                </div>`;
            } else if (isOpen && s.type === 'actual') {
                subItems = `<div style="background:var(--sp-panel);padding:12px 24px;">
                    <a href="${s.href}" style="font-size:13px;color:var(--sp-ink-70);font-weight:500;text-decoration:none;">View ${s.label} &rarr;</a>
                    ${!isThisMonth ? '<p style="font-size:12px;color:var(--sp-ink-50);margin-top:4px;">Actual spending shown for current month only.</p>' : ''}
                </div>`;
            }

            return `
                <div style="border-bottom:1px solid var(--sp-ink-04);">
                    <div class="flex items-center gap-4" style="padding:14px 24px;cursor:pointer;transition:background 0.15s;" onmouseover="this.style.background='var(--sp-ink-04)'" onmouseout="this.style.background=''" onclick="toggleCat('${s.key}')">
                        <div style="width:10px;height:10px;border-radius:3px;background:var(--cat-${s.key}-dot);flex-shrink:0;"></div>
                        <span style="font-size:13px;color:var(--sp-ink-70);width:128px;flex-shrink:0;">${s.label}</span>
                        <div class="flex-1" style="background:var(--sp-ink-08);border-radius:999px;height:4px;">
                            <div style="height:4px;border-radius:999px;transition:width 0.5s;width:${isEmpty ? 0 : pct}%;background:var(--cat-${s.key}-dot);"></div>
                        </div>
                        <span class="sp-num" style="font-size:13px;font-weight:600;color:var(--sp-ink);width:80px;text-align:right;">${isEmpty ? '—' : fmt(val)}</span>
                        <svg style="width:16px;height:16px;color:var(--sp-ink-30);transition:transform 0.2s;flex-shrink:0;${isOpen ? 'transform:rotate(180deg);' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </div>
                    ${subItems}
                </div>`;
        }).join('');

        document.getElementById('breakdown-list').innerHTML = html;
    }

    function toggleCat(key) {
        expandedCat = expandedCat === key ? null : key;
        renderTab();
    }

    function renderPayments(payments, isThisMonth) {
        if (!payments.length) {
            document.getElementById('payments-list').innerHTML = '<p style="color:var(--sp-ink-50);font-size:13px;text-align:center;padding:16px 0;">No recurring payments found.</p>';
            return;
        }

        const html = payments.map(p => {
            const isPast  = isThisMonth && p.diffDays < 0;
            const isToday = p.diffDays === 0;
            const isSoon  = p.diffDays > 0 && p.diffDays <= 3;

            let urgencyBadge = '';
            if (isToday)      urgencyBadge = `<span style="font-size:11px;background:var(--sp-up-bg);color:var(--sp-up);font-weight:600;padding:2px 8px;border-radius:999px;">Today</span>`;
            else if (isSoon)  urgencyBadge = `<span style="font-size:11px;background:var(--sp-warn-bg);color:var(--sp-warn);font-weight:600;padding:2px 8px;border-radius:999px;">In ${p.diffDays}d</span>`;
            else if (isPast)  urgencyBadge = `<span style="font-size:11px;background:var(--sp-ink-04);color:var(--sp-ink-30);font-weight:500;padding:2px 8px;border-radius:999px;">Past</span>`;
            else if (isThisMonth) urgencyBadge = `<span style="font-size:11px;color:var(--sp-ink-50);">In ${p.diffDays}d</span>`;

            const dateLabel = p.date.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
            const catKey = p.category === 'subscription' ? 'subscriptions' : p.category;

            return `
                <div class="flex items-center gap-4" style="padding:12px 0;border-bottom:1px solid var(--sp-ink-04);${isPast ? 'opacity:0.4;' : ''}">
                    <div style="width:48px;height:48px;border-radius:10px;background:${isToday ? 'var(--sp-ink)' : isPast ? 'var(--sp-ink-04)' : isSoon ? 'var(--sp-warn-bg)' : 'var(--sp-panel)'};display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;">
                        <span class="sp-num" style="font-size:15px;font-weight:700;line-height:1;color:${isToday ? '#fff' : isPast ? 'var(--sp-ink-30)' : isSoon ? 'var(--sp-warn)' : 'var(--sp-ink)'};">${p.day}</span>
                        <span style="font-size:9px;color:${isToday ? 'rgba(255,255,255,0.8)' : 'var(--sp-ink-50)'};text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;">${p.date.toLocaleString('en-GB',{month:'short'})}</span>
                    </div>
                    <div class="flex-1" style="min-width:0;">
                        <div class="flex items-center gap-2 flex-wrap">
                            <p style="font-size:13px;font-weight:500;color:var(--sp-ink);${isPast ? 'text-decoration:line-through;' : ''}">${p.name}</p>
                            ${badge(catKey)}
                            ${urgencyBadge}
                        </div>
                        <p style="font-size:12px;color:var(--sp-ink-50);margin-top:2px;">${dateLabel}</p>
                    </div>
                    <p class="sp-num" style="font-size:14px;font-weight:700;color:var(--sp-ink);flex-shrink:0;">${fmt(p.amount)}</p>
                </div>`;
        }).join('');

        document.getElementById('payments-list').innerHTML = html;
    }

    load();
</script>
</body>
</html>
